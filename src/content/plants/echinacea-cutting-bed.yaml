name: Echinacea (cutting bed)
type: perennial
location: Backyard (cutting bed)
zones:
  - 3
health: Newly planted May 2026. 2 plants from 100mm pots in the cutting bed, mulched with sugarcane. Establishing.
healthStatus: establishing
lastAssessed: 2026-09
image: /images/plants/cutting-bed.jpg
photos:
  - src: /images/winter-2026/IMG_2289.jpg
    caption: Dormant under straw — normal for August (6 Aug 2026)
  - src: /images/winter-2026/IMG_2293.jpg
