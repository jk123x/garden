notes: "Senecio serpens 'Dwarf Blue' (syn. Curio repens), designer-confirmed — every blue chalk sticks patch in the front garden is this one species; the big floppy mounds are just older, part-shaded plants (winter-lean leaves read flatter and longer). Flowers: cream-white button clusters on stalks above the blue mat, summer-autumn — that's the flowering Jay remembers in this bed (IMG_0887 shows it). The broad wavy powdery paddles near the gate are a different plant: Cotyledon 'Silver Waves', its own entry. The feathery blue-grey sprigs in the winter photos (IMG_2332/2333) were trample debris from the work sessions, not a plant. Stem segments dropped into gaps root easily. Very drought-tolerant, practically indestructible. Avoid overwatering in winter."
tasks:
  - months:
      - 10
    day: 20
    task: Spring recovery check on the gate patch — any stem that hasn't reshot by late Oct gets trimmed back to a live node; poke loose healthy segments into remaining gaps
    category: prune
  - months:
      - 3
    task: "Leggy trim (5 min): the trigger is bare woody stem showing between the soil and the blue fingers. Cut those stems back to a point where fingers still grow, and poke the cut-off tips into any gap, they root. Never water them in, wet soil kills these"
    category: prune
  - months:
      - 9
    task: "Feed (2 min): a light scatter of Osmocote Native across the patches, less than the bag rate. Succulents hardly need it, and rich feed makes them soft and floppy"
    category: feed
    completed: 2026-07
  - months:
      - 5
    task: "Snip spent flower stalks (5 min): the cream button heads go brown by now. Cut each stalk at its base so the patches stay flat and blue"
    category: prune
