name: Dwarf Blue Chalk Sticks
type: groundcover
location: Front yard
zones:
  - 1
health: "Main mounds dense, plump, good colour — wintering well. The patch near the gate is flattened with woody stems exposed after the 7 Aug asparagus-fern removal: cosmetic only, everything's alive. It re-clothes from stem nodes through spring — expect it to look rough until ~Oct and be filled in by Dec. No extra water meanwhile (winter wet is the one thing that kills these)."
healthStatus: good
lastAssessed: 2026-09
log:
  - date: "2026-10-17"
    entry: "Card audit 17 Oct 2026: spent flower stalk snip added."
    category: general
  - date: "2026-09-05"
    entry: Jay calls the gate patch sorted for now — the optional poke-segments-in job is off the list. Let it re-clothe through spring on its own; the October check on the spring regrowth stands.
    category: general
  - date: "2026-08-07"
    entry: "Designer confirmation: the chalk sticks are Dwarf Blue (serpens), per the garden designer's email — closes the serpens-vs-mandraliscae question for good. One species across the whole bed."
    category: general
  - date: "2026-08-07"
    entry: "Second ID pass, Jay's 'Blue Spruce' sedum hypothesis for the big mounds tested against the photos with the drip riser as a scale ruler — REJECTED on every character (leaves 2-3× too long, flattened not terete needles, chalky farina not green-blue, thick bare stems not wiry pink threads, and spent CREAM button flowers on the stem tips where sedum throws yellow stars). Same measurements also demoted mandraliscae (leaves half its minimum length): the mounds are most likely just old sprawling serpens (~65%) — same species as the tight mats, different age and sun. Longest-leaf tie-breaker queued as a passing job. Health verdict from the photos: everything alive; the roughed-up gate patch is cosmetic and re-clothes through spring."
    category: general
  - date: "2026-08-07"
    entry: "ID CORRECTION (supersedes the earlier entry today): Jay realised the 'misshapen broad-leaf' plant near the gate is NOT chalk sticks — it's Cotyledon 'Silver Waves' (his ID, verified ~90% at species level; new catalogue entry). And the big floppy mounds with longer flatter pointed leaves are probably the full-size blue chalk sticks (mandraliscae), not the dwarf — side-by-side leaf test pending, same care regardless. The true dwarf patches are the tight mats of short chunky fingers. Recovery advice split: chalk-stick stem bits still re-root when poked in; the cotyledon's detached LEAVES don't — bin those, use stem pieces."
    category: general
  - date: "2026-08-07"
    entry: "Bed tidy-up session (photos IMG_2332/2333): the patch near the gate got roughed up in the asparagus-fern removal — a section is flattened with old woody brown stems exposed, loose fingers/stem bits scattered across the straw, and some stems carrying misshapen, flattened-looking leaves. [Broad-leaf ID in this entry corrected later same day — see above.] Recovery is automatic: it re-leafs along the woody frame in spring, and detached pieces are free plants — poke healthy segments a few cm into soil wherever cover is wanted and they root. The big mound by the path is untouched and dense."
    category: general
  - date: "2026-08-06"
    entry: End-of-winter baseline photos (IMG_2266/2273/2279). Good blue colour, plump leaves, patches expanding along the fence line and bed edges. Wintered fine.
    category: general
