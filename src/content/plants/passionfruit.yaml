notes: "Growing on the back (north) fence, tangled in with the star jasmine. The two climbers share the fence, so they compete — passionfruit leaves are larger and 3-lobed vs the jasmine's small glossy ovals. Passionfruit are short-lived (5-7 years) and heavy feeders. STANDING ARRANGEMENT (revised Aug 2026): the vine may run east past the shed as a TRAINED TOP-WIRE CAP over the patchy laundry-side run — two-storey model, same as the back fence: vine owns the top wire, jasmine owns the fence face below (new jasmines climb from the bottom, ~10m east, no conflict for years). Hard rules: the shed ROOF is forbidden (dead mats, gutters, ladder work — cut-and-pull strays while green); runners diving down the fence face come out at each winter prune; dropped fruit along that blind-corner run gets picked up and binned (fruit fly). Exit condition: when the vine declines (it's short-lived) or the jasmine reaches the top wire, the vine gives ground — it's the temporary storey."
log:
  - date: "2026-08-06"
    entry: "End-of-winter baseline photos (IMG_2305/2311). Post-prune cap sitting as a clean band along the back fence top. Jay confirmed IMG_2311 is the runner from the backyard having reached the FAR side of the shed (outside the laundry) — the east extension has already covered the distance, ahead of expectations. Arrangement rules apply out there now: top wire only, no face-diving into the jasmine's mesh, no shed roof, and that blind corner joins the fruit-drop pickup route in season."
    category: general
  - date: "2026-08-02"
    entry: "WINTER PRUNE COMPLETE (second pass, same day): dead thatch picked out of the cap's right half, strongest east-bound runners tied along the top wire past the shed (east extension arrangement now live), remaining shed-corner tangle cut and pulled while green, roof cleared, fruiting stems spared until harvest. Vine set up for the October new-growth flush — fruit forms on that growth."
    category: prune
  - date: "2026-08-02"
    entry: "First prune pass done — cap tightened to a clean band, hanging ropes shortened by a third, jasmine border kept (photos IMG_2173/2175). Green fruit spotted near the shed corner — first confirmed fruit; ripens on the vine into spring. Decision: containment at the shed line, no eastward roaming (jasmine recovery zone + roof/gutter/fruit-fly downsides). Remaining: dead-thatch pick on the right half, de-roof the runners (cut reachable, pull while green), fruiting stems spared until harvest."
    category: prune
  - date: "2026-07-29"
    entry: "Fed with Richgro All Purpose (pre-baby feed blitz) — replaces the September feed."
    category: feed
