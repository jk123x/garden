name: Passionfruit
type: climber
location: Backyard
health: "Composted and fresh sugarcane mulch down in April 2026. Growing through the star jasmine on the back fence — decent foliage coverage. No visible fruit. Holding its own against the vigorous jasmine."
healthStatus: good
lastAssessed: "2026-04"
urgency: week
nextAction: "Hard prune — cut back by a third. Late-winter window, and the only chance before the baby arrives. Untangle from the jasmine as you go (3-lobed leaves = passionfruit)."
image: /images/plants/IMG_0979_2.jpg
notes: "Growing on the back (north) fence, tangled in with the star jasmine. The two climbers share the fence, so they compete — passionfruit leaves are larger and 3-lobed vs the jasmine's small glossy ovals. Passionfruit are short-lived (5-7 years) and heavy feeders. Compost + sugarcane mulch just done (Apr 2026). Should be producing fruit through autumn — check for any on the ground. Hard prune in late winter."
