name: Star Jasmine (West fence)
type: climber
location: Left (west) side fence and pergola
zones:
  - 4
health: Pine bark mulch down April 2026 (debris cleared first). Moderate coverage growing along the west side fence and up into the pergola. Not as dense as the back fence but filling in. Stems healthy and climbing.
healthStatus: good
lastAssessed: 2026-10
