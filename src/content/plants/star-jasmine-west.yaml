name: Star Jasmine (West fence)
type: climber
location: Left (west) side fence and pergola
zones: [4]
health: "Pine bark mulch down April 2026 (debris cleared first). Moderate coverage growing along the west side fence and up into the pergola. Not as dense as the back fence but filling in. Stems healthy and climbing."
healthStatus: good
lastAssessed: "2026-04"
image: /images/winter-2026/IMG_2280.jpg
photos:
  - src: /images/winter-2026/IMG_2280.jpg
    caption: "The side path — dense mid-run, bare trellis near end (6 Aug 2026)"
  - src: /images/winter-2026/IMG_2281.jpg
    caption: "Espaliered stems with tie-audit ties (6 Aug 2026)"
  - src: /images/winter-2026/IMG_2282.jpg
