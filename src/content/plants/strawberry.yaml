name: Strawberry
type: fruit
location: Backyard (near path)
zones:
  - 2
  - 4
health: Healthy plants, flowering and setting fruit Oct 2026, but the crop is being thinned by a toddler pulling green fruit and snails are active in the patch (17 Oct). Crowns intact.
healthStatus: good
lastAssessed: 2026-10
image: /images/plants/IMG_0920.jpg
notes: Multiple plants along the stone path, spreading via runners. The dark green colour and active runner production are good signs — the plants are establishing and expanding. Autumn runners that root in now will be strong producers next spring/summer. No obvious pest damage (slugs, aphids). Remove any yellowed leaves at the base to reduce fungal disease risk over the damp winter months.
tasks:
  - months:
      - 3
    task: "Autumn feed (5 min): Richgro All Purpose, normal dose scattered between the plants and watered in. Autumn is when next spring's crowns build, so this is the feed that sets the crop."
    category: feed
  - months:
      - 9
    task: "Spring feed (5 min): Richgro All Purpose, normal dose scattered between the plants and watered in, as the new leaves push. Not on the crowns."
    category: feed
    completed: 2026-07
  - months:
      - 4
    task: "Straw mulch (10 min): sugarcane from the bale tucked under the leaves so fruit sits on straw, not soil (soil contact = rot and slugs). Keep it off the crowns or they rot too."
    category: mulch
    completed: 2026-04
  - months:
      - 10
      - 11
      - 12
      - 1
    task: Harvest ripe fruit
    category: harvest
  - months:
      - 8
    task: "Winter clean-up (15 min, scissors): cut every old, red or dead leaf off at the base so the crown starts spring clean (grey mould overwinters on old leaves). Then let autumn-rooted runners stay, they're next summer's producers"
    category: prune
  - months:
      - 10
      - 11
    task: "Snail bait, straw, runners off (10 min): tuck fresh sugarcane under the leaves so the fruit sits on straw not soil (leftover from the citrus bales). snails seen in the patch 17 Oct. Multiguard in a thin scatter between the plants, a pellet every 5cm, never piles (toddler in the bed), reapply after rain. Lift the straw edges and pick off what's hiding there at dusk. Snip runners while the plants are fruiting so the energy goes to fruit. Any crown pulled loose by small hands = press it back in at soil level and water"
    category: general
  - months:
      - 3
    task: "Runner sort (10 min): a runner with its own roots and a good crown = snip the cord and leave it as a new plant. Runners crossing the path = cut off. Three-year-old crowns that fruited poorly = pull them, the young plants replace them"
    category: prune
log:
  - date: "2026-10-17"
    entry: "Jay's daughter has been ripping up the baby strawberries, a lot of green fruit lost. Plants themselves fine as long as crowns stay in the ground (press any loose crown back in at soil level). Snails spotted in the patch today (her catch). Advice: Multiguard thin scatter now, reapply after rain, two dusk torch walks, lift the straw edges when looking; net tunnel over the patch for the fruiting weeks if the damage keeps up, otherwise accept a thin crop this season."
    category: general
  - date: "2026-10-17"
    entry: "Card audit 17 Oct 2026: spring runner/snail row added, clean-up moved to August, autumn runner sort added."
    category: general
  - date: "2026-09-17"
    entry: "Irrigation: this area is on ZONE 2's drip line (shrubblers found buried and dug out 17 Sept) as well as zone 4."
    category: water
  - date: "2026-08-06"
    entry: End-of-winter baseline photos taken around the path/tub area. Plants quiet through winter as expected; fed 30 Jul, straw in place. Watch for new leaf push from late Aug.
    category: general
  - date: "2026-07-30"
    entry: Fed with Richgro All Purpose (feed blitz round 2) — September feed replaced.
    category: feed
