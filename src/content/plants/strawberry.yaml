name: Strawberry
type: fruit
location: Backyard (near path)
zones:
  - 2
  - 4
health: Healthy plants, flowering and setting fruit Oct 2026, but the crop is being thinned by a toddler pulling green fruit and snails are active in the patch (17 Oct). Crowns intact.
healthStatus: good
lastAssessed: 2026-10
image: /images/plants/IMG_0920.jpg
notes: Multiple plants along the stone path, spreading via runners. The dark green colour and active runner production are good signs — the plants are establishing and expanding. Autumn runners that root in now will be strong producers next spring/summer. No obvious pest damage (slugs, aphids). Remove any yellowed leaves at the base to reduce fungal disease risk over the damp winter months. NO SNAIL BAIT in this patch, ever: the toddler grazes it (Jay, 11 Nov 2026). Hand-pick snails instead.
tasks:
  - months:
      - 3
    task: "Autumn feed: Richgro All Purpose, normal dose scattered between the plants and watered in. Autumn is when next spring's crowns build, so this is the feed that sets the crop."
    category: feed
  - months:
      - 9
    task: "Spring feed: Richgro All Purpose, normal dose scattered between the plants and watered in, as the new leaves push. Not on the crowns."
    category: feed
    completed: 2026-07
  - months:
      - 4
    task: "Straw mulch: sugarcane from the bale tucked under the leaves so fruit sits on straw, not soil (soil contact = rot and slugs). Keep it off the crowns or they rot too."
    category: mulch
    completed: 2026-04
  - months:
      - 10
      - 11
      - 12
      - 1
    task: Harvest ripe fruit
    category: harvest
  - months:
      - 8
    task: "Winter clean-up (scissors): cut every old, red or dead leaf off at the base so the crown starts spring clean (grey mould overwinters on old leaves). Then let autumn-rooted runners stay, they're next summer's producers"
    category: prune
  - months:
      - 10
      - 11
    task: "Snails and straw in the strawberry patch. NO snail pellets here, ever: the two-year-old grazes this patch and the pellets look like cereal. 1) Snails: hand-pick at dusk or after rain into a bucket, lift the straw edges and the lowest leaves where they hide. 2) Tuck sugarcane under the leaves so the fruit sits on straw, not soil. 3) Runners (the thin bare wiry stems creeping flat along the ground with a baby plantlet at the end, not the short upright flower stems): let them roam inside the bed, Jay's call. Cut only the ones heading out of the bed or across the path, at the mother plant. 4) Press any crown the kids have pulled loose back in at soil level and water it."
    category: general
    completed: "2026-11"
  - months:
      - 3
    task: "Runner sort (scissors): 1) each runner keeps its first plantlet, press it onto bare soil so it roots, snip the stem beyond it. 2) Runners crossing the path = cut off at the mother. 3) Pull the tired old mothers (woody crown, small leaves, poor fruit this season), the daughters replace them. Letting them run is the renewal plan, so this sort is what keeps the patch from becoming a mat 4) Any runner that has crept under the dusty miller's outer leaves = cut at the mother, it will never fruit in that shade."
    category: prune
log:
  - date: "2026-11-11"
    entry: "SAFETY RULE (Jay, 11 Nov 2026): no snail bait of any kind in the strawberry patch, the toddler grazes it. Multiguard (iron EDTA) is the lowest-toxicity bait but a mouthful can still poison a small child and the pellets look like cereal. Snails here are hand-picked from now on. Poisons Information Centre 13 11 26 if she eats any. Pellets already down today: hose the patch so they dissolve into the straw, keep her out for a couple of days."
    category: general
  - date: "2026-11-11"
    entry: "Snails-and-straw row done (Jay). Same session: runners under the dusty miller cut at the mother and strays in other plants' space pulled, open-ground spread kept."
    category: general
  - date: "2026-11-11"
    entry: "Boundary with the dusty miller set (Jay): strawberries own all the ground outside the dusty miller's footprint; runners that creep under its outer leaves get cut at the mother whenever he's passing and at the March sort. The mound's overhang gets cut back at its December shear."
    category: general
  - date: "2026-11-09"
    entry: "Runner policy set (Jay): let them roam inside the bed, kids love them. Only path-bound and out-of-bed runners get cut in season; the March sort keeps the first plantlet per runner and pulls worn-out mothers. Cost is a little less fruit per mother, accepted."
    category: general
  - date: "2026-10-28"
    entry: "Sugarcane tucked under the plants from the leftover of the citrus bales (Jay: bales done)."
    category: mulch
  - date: "2026-10-17"
    entry: "Jay's daughter has been ripping up the baby strawberries, a lot of green fruit lost. Plants themselves fine as long as crowns stay in the ground (press any loose crown back in at soil level). Snails spotted in the patch today (her catch). Advice: Multiguard thin scatter now, reapply after rain, two dusk torch walks, lift the straw edges when looking; net tunnel over the patch for the fruiting weeks if the damage keeps up, otherwise accept a thin crop this season."
    category: general
  - date: "2026-10-17"
    entry: "Card audit 17 Oct 2026: spring runner/snail row added, clean-up moved to August, autumn runner sort added."
    category: general
  - date: "2026-09-17"
    entry: "Irrigation: this area is on ZONE 2's drip line (shrubblers found buried and dug out 17 Sept) as well as zone 4."
    category: water
  - date: "2026-08-06"
    entry: End-of-winter baseline photos taken around the path/tub area. Plants quiet through winter as expected; fed 30 Jul, straw in place. Watch for new leaf push from late Aug.
    category: general
  - date: "2026-07-30"
    entry: Fed with Richgro All Purpose (feed blitz round 2) — September feed replaced.
    category: feed
