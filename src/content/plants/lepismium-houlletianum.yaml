notes: "Snowdrop cactus. Epiphytic, trailing habit. Long flat serrated strap-stems. The pale wiry threads it throws from stem nodes are aerial roots — normal for the species, not pest webbing; snip for looks or leave. Watering: epiphyte, dries between drinks. Top cm dry in summer, every 3-4 weeks in winter."
