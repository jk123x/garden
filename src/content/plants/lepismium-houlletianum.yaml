name: Lepismium Houlletianum
type: succulent
indoor: true
location: Study
health: "Healthy — first photo assessment Aug 2026: long arching serrated stems, deep even green, good hydration. Minor pale nicks on some stem edges (mechanical rubbing) — cosmetic. Aerial roots along stems are normal epiphyte behaviour."
healthStatus: healthy
lastAssessed: "2026-08"
image: /images/plants/study-shelf-aug-2026.jpg
photos:
  - src: /images/plants/study-shelf-aug-2026.jpg
    caption: "First photo on file — the study shelf, arching over the rhipsalis (23 Aug 2026)"
notes: "Snowdrop cactus. Epiphytic, trailing habit. Long flat serrated strap-stems. The pale wiry threads it throws from stem nodes are aerial roots — normal for the species, not pest webbing; snip for looks or leave."
log:
  - date: "2026-08-23"
    entry: "First photo assessment (study shelf shot) — closes the 'no photo on file' gap from April. Verdict: healthy. Deep green well-hydrated stems, strong arching habit. A few pale-edge nicks = shelf rubbing, cosmetic. Aerial roots present and normal."
    category: general
tasks:
  - months: [9, 10, 11, 12, 1, 2]
