notes: "Cotyledon orbiculata 'Silver Waves' — CONFIRMED Aug 2026: the garden designer emailed Jay the plant name, so this is definite, not a photo ID. Broad obovate paddle leaves with wavy, sometimes twisted margins and a powdery white farina that rubs off on your thumb (that rub-off is the 30-second confirm — felted lookalikes like Angel Wings senecio don't wipe clean). Leaves in opposite pairs at the tips of thick woody-succulent sprawling stems. Was mistaken for more of the dwarf blue chalk sticks until Aug 2026 — the bed's only other blue is the Dwarf Blue chalk sticks (designer-confirmed, one species). 100% confirm comes at flowering: a tall 30-60cm stalk of drooping orange/coral bells, likely late spring-summer. DON'T rub the leaves for fun — the farina is the ornament and doesn't regenerate. Propagation: stem cuttings only (callus a few days, then insert); detached leaves strike poorly, not worth saving. CAT-SAFETY FLAG: unlike the chalk sticks (mild GI-only), Cotyledon orbiculata contains bufadienolide cardiac glycosides — genuinely toxic if grazed in quantity (documented in dogs/livestock). Realistic risk to a passing cat is low (bitter, powder-coated, cats don't graze it), but it's the one plant in the bed that isn't technically cat-safe — Jay's informed call to keep it, made Aug 2026."
