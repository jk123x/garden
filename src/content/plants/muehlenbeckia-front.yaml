name: Muehlenbeckia (Front, new)
type: climber
location: Front fence
health: "Light trim and mulched April 2026 — spreading out a bit. Still sparse, thread-like stems weaving along the fence base. Top half browned off suddenly mid-May 2026, same week as the East star jasmine and almost certainly the same cause: cold-night / warm-sunny-day desiccation of an establishing plant on shallow immature roots with no drip — the exposed upper portion went, the sheltered lower growth stayed green. Not disease, not the seaweed. Recovery expected — muehlenbeckia reshoots vigorously from live lower wood. Will need 1-2 growing seasons to show real coverage."
healthStatus: struggling
lastAssessed: "2026-05"
urgency: later
nextAction: "Scratch-test the dead-looking top (green = will reshoot in spring, leave it) and check for a girdling tie while doing the jasmine tie audit. Strip dead growth anytime. Structural trim + feed at the normal September window."
image: /images/plants/IMG_0957.jpg
notes: "New planting along the front fence, extending the coverage from the established muehlenbeckia section. Still in very early stages — just small thread-like stems starting out. Given how vigorous the established section is, this should fill in well once roots take hold. Keep watered through dry spells while establishing. Don't worry about the slow start — muehlenbeckia is deceptively quick once the root system is in place."
tasks:
  - months: [3, 9]
    task: Trim to shape
    category: prune
  - months: [9]
    task: Feed with slow-release fertiliser
    category: feed
  - months: [12, 1, 2]
    task: Water in extended dry periods
    category: water
log:
  - date: "2026-05-18"
    entry: "Top half browned off suddenly mid-May, reported same week as the East star jasmine desiccation. Same diagnosis by parallel: cold-night / warm-sunny-day swing, establishing plant on shallow immature roots with no drip — exposed upper portion died, sheltered lower growth stayed green. Zoomed crops confirmed it: upper run pale/browned and heavily defoliated (bare wiry stem), lower drape still green — same exposed-top/sheltered-base signature as the jasmine (the lush green behind the mesh is background grass/weeds, not the vine). Synchronous timing + matching pattern across two unrelated plants makes the environmental cause confident. Recovery expected; do not over-water (15mm rain 17 May was sufficient). Scratch-test stems + check for a girdling stem to rule out mechanical."
    category: general
