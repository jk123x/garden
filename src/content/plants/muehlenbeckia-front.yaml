name: Muehlenbeckia (Front, new)
type: climber
location: Front fence
health: "Tidied and trimmed July 2026 — dead growth from the May top-dieback cleaned up. Recovering: muehlenbeckia reshoots vigorously from live lower wood, expect the real bounce-back with spring warmth. Will need 1-2 growing seasons to show real coverage."
healthStatus: monitor
lastAssessed: "2026-07"
urgency: later
nextAction: "Once spring runners reach about a metre, pinch the tips to force low branching, and train stems sideways along the fence rather than letting them race upward. Glance at it after any big cold-night/warm-day swing — still shallow-rooted after the May dieback."
image: /images/plants/IMG_0957.jpg
notes: "New planting along the front fence, extending the coverage from the established muehlenbeckia section. Still in very early stages — just small thread-like stems starting out. Given how vigorous the established section is, this should fill in well once roots take hold. Keep watered through dry spells while establishing. Don't worry about the slow start — muehlenbeckia is deceptively quick once the root system is in place."
