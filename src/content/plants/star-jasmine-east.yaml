health: "7 Oct 2026: spring tie-in session done on the laundry side. The second-last plant toward the back garden is dead (May collapse casualty), cut to the stump, replacement due this month. Earlier: scratch test done and confirmed-dead growth cut out along the laundry side, 5 Aug 2026. Some MARGINAL stems deliberately left on the fence — wait-and-see through spring. The October flush is the verdict: anything that hasn't pushed new leaf by late October is dead and comes off then. Sparse but tidy going into spring. Ties removed run-wide (tie audit complete). Both new 150mm plants (planted 1 May past the giant taro stump, on drip since May) totally healthy — over-feed watch cleared 5 Aug with no leaf-edge browning."
