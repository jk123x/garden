name: Star Jasmine (East fence)
type: climber
location: Right (east) side fence, near kids' bedrooms (laundry side)
health: "Pine bark mulch down April 2026 (debris cleared first). Original run still very sparse — mostly bare stems with scattered fresh leaf growth. Wall-top run flagged pale/yellow-green on 13 May, then crisped to brown/desiccated by 15 May — desiccation collapse of the most exposed, shallowest-rooted section, driven by the cold-night / warm-sunny-day swing (chilled shallow roots can't resupply water fast enough on a run of 22°C blue-sky days; dark fence radiates extra heat onto foliage pressed against it), worsened by thin wall-top soil, no drip on the original run, irrigation off for winter. NOT the eco-seaweed. Crisped leaves are dead; lower foliage and the 2 new plants unaffected. Deep-soaked ~50L+ on 15 May + 15mm slow rain 17 May — root zone recharged, now in recovery/monitor awaiting the scratch-test verdict on which stems survived. Both new 150mm plants planted 1 May 2026 past the giant taro stump, 1m apart — backfilled with native clay / garden soil / compost mix, watered in, pine bark mulched, tied to fence wires."
healthStatus: struggling
lastAssessed: "2026-05"
urgency: ongoing
nextAction: "New jasmines: 5L per plant only during dry stretches — winter rain covers it otherwise. Overdue: scratch-test the desiccated wall-top stems for the survival verdict (green under bark = leave it, brown/snaps = cut it out), and strip dead leaves. Include this run in the tie audit."
image: /images/plants/sj-east-side.jpg
notes: "Trachelospermum jasminoides. Right (east) side fence near kids' bedrooms. Still very early — bare woody stems with small new leaves just starting to emerge. Be patient with this one. Tie stems to the fence where you want them to go, feed well in spring and summer, and keep watered through dry spells while it's establishing. It'll get there. Extension run begins past the cleared taro area — same conditions, same care."
