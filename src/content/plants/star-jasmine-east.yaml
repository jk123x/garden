notes: "Trachelospermum jasminoides. Right (east) side fence near kids' bedrooms. Still very early — bare woody stems with small new leaves just starting to emerge. Be patient with this one. Tie stems to the fence where you want them to go, feed well in spring and summer, and keep watered through dry spells while it's establishing. It'll get there. Extension run begins past the cleared taro area — same conditions, same care. Shared-fence note (Aug 2026): the passionfruit is approved to run a trained cap along the TOP WIRE of this fence from the shed end — two-storey model, the jasmine owns the fence face. The vine is short-lived and gives ground when it declines or when the jasmine reaches the top; passionfruit runners diving down into the jasmine's wires get removed at each winter prune. Framework rule (Jay, 16 Oct 2026): ONE leader per wire per direction. A second runner twining the same wire gets, in order: rerouted to a bare wire or gap, or snipped to 2-3 leaves as a fill-in lateral, or cut out at the base only where that stretch is already covered. Never cut the short perpendicular side shoots off a tied leader (that's the fill) or the old brown framework."
tasks:
  - months:
      - 1
      - 2
    task: "After-flowering prune: this run is being pushed for coverage, so prune means remove only what is wrong: dead stems, runners diving off the fence face toward the ground, and anything tangling into the passionfruit on the top wire (the vine owns the wire, the jasmine owns the fence face). Then, on the COVERED laundry end only, the haircut: shear the face flat to 10cm off the fence, cut anything above the top wire back to just below it, and thin the tangle to a skeleton of one stem per grate, cutting surplus woody stems at the base. It re-clothes over summer and sets next year's buds on the new growth. Bare sections keep every live runner."
    category: prune
  - months:
      - 9
    task: "Feed: Richgro All Purpose, LIGHT dose spread wide around the two new plants and never against the stems (one over-feed scare already). Normal dose along the established part of the run. Water in."
    category: feed
    completed: 2026-07
  - months:
      - 12
    task: "Growth-push top-up: second slow-release dose (Richgro) — the July feed is spent by now. LIGHT dose spread wide near the new plants, never against stems (they've had one over-feed scare already)"
    category: feed
    completed: "2026-11"
  - months:
      - 1
    task: "Growth-push second dose: Richgro All Purpose, LIGHT dose spread wide around the young plants and never against a stem, normal dose along the established laundry end, watered in. Only if the last Richgro went down six or more weeks ago (check the card's last-fed line). Don't feed onto sodden soil; because the slow-release is spent at six weeks and Jan-Feb is the coverage run."
    category: feed
  - months:
      - 3
    task: "Autumn feed: Richgro All Purpose, light dose wide around the new plants, normal dose along the rest, watered in. Carries the run through the last warm flush before winter. Skip it if the last Richgro went down after mid-January."
    category: feed
  - months:
      - 10
    day: 1
    task: "THE timing-critical session: go the week the new runners hit 30-60cm and still bend easily — hot spring could mean NOW, typical is mid-Oct. Flush on and runners supple — pinch the tips of the new plants' leaders and any leader you want to branch, then tie the soft new runners into the SPARSE laundry-side fence and the wires past the taro (loose figure-8s, led horizontally). This one session sets the whole season's direction. Cool spring / no runners yet? Wait until they hit 30cm and do it then"
    category: general
    completed: 2026-10
  - months:
      - 10
      - 11
    task: "Plant the new jasmine in the dead one's spot. 1) Dig the old stump out: spade in a circle 20cm out, lever up. 2) Hole twice the pot width, same depth the plant sat in the pot. 3) Backfill with the soil you dug, firm, 10L of water. 4) Move the existing dripper to sit at the stem. 5) Tie the longest shoot to the lowest wire, loose figure-8. Bark back around it, off the stem. No fertiliser"
    category: plant
    completed: "2026-10"
  - months:
      - 10
      - 11
    task: "Pale jasmine (the May planting past the taro stump): 1) pull the pine bark back 10cm from the stem so the crown can breathe. 2) Poke a finger in 5cm beside it: muddy = leave it alone, the soil is the problem. Don't feed it yet; because fertiliser on cold waterlogged roots burns instead of greening"
    category: general
    completed: 2026-11
  - months:
      - 11
    day: 7
    task: "Liquid feed the pale jasmine (watering can): only when the top 5cm is damp, not wet. PowerFeed at 2ml/L, one full can over the root zone of each May planting, none against the stem. Don't use Richgro; because granules leach straight through wet soil and these two have the over-feed history"
    category: feed
    completed: 2026-11
  - months:
      - 11
    day: 14
    task: "Pale-plant recheck on the May 2026 planting past the taro stump: stand it next to its neighbour and compare leaf colour. Darkened up after the liquid feed and a warm fortnight = done, nothing more. Still pale with green veins on the youngest leaves = iron lockout, buy iron chelate (not Multiguard, that is snail bait) and water a 1g/L can over the root zone. Oldest leaves yellow and dropping while the soil is still wet = waterlogging, keep the bark pulled back and skip that dripper until it dries. Don't add Richgro either way, December's top-up is the next granular feed"
    category: general
    completed: 2026-11
  - months:
      - 11
    day: 18
    task: "Settle check on the new jasmine (planted 28 Oct in compost): look at where the stem meets the soil. Crown sunk below the surrounding ground = scrape bark and compost back off the stem so it sits in a shallow dish, no further. Crown standing proud with roots showing = tuck a handful of soil around them. Then confirm the dripper is wetting the root ball, not the gap beside it. No fertiliser, the compost is plenty"
    category: general
  - months:
      - 10
    task: "Thin the covered laundry end to one leader per wire (secateurs, then scissors). Wire by wire: 1) Where a wire carries 2-4 shoots, keep the lowest one that is twined on. 2) Trace each extra shoot back to where it leaves its parent stem and cut it there, at the base, never shortened. 3) Old brown stems with leaves and bud clusters stay, they carry the Christmas flowers. Swap one out only when it is barely growing and a vigorous new shoot from a different stem runs the same wire. Bare sections: keep every runner. No shearing the face, that is the January job"
    category: prune
  - months:
      - 11
      - 12
      - 1
      - 2
      - 3
    task: "Cohort ties: one leader per wire per direction, Highlander rule. Untwine any new runner competing on an already-led wire and reroute it to bare wire or a gap; no gap in reach = snip it to 2-3 leaves as a fill lateral. tie the newest batch of runners into the remaining laundry-side gaps while they're still supple — each month's growth is a fresh chance to fill fence Pinch rule: a runner heading into bare fence is NOT pinched, lead it horizontally and let it run until it reaches the far edge of the gap, then pinch so it fills back. Pinch only shoots over already-covered fence and anything racing above the top wire. A wire's leader is never tipped until it reaches the end of its wire: pinching makes density, running makes coverage."
    category: general
    repeat: monthly
    completed: 2026-11
  - months:
      - 10
      - 11
    task: Verdict on the wait-and-see stems — any marginal stem from the May collapse that hasn't pushed new leaf by now is dead; cut it out. Two minutes with secateurs.
    category: prune
    completed: 2026-10
  - months:
      - 11
      - 12
    task: "Kikuyu ring check at the new plants — the Aug clear will regrow from nodes in the brick joints once it warms up. Defend a ~30cm ring around each plant only: lift regrowth with fingers when soil is moist, hands only near the dripper, green-bin it. Don't fight the whole brick apron."
    category: general
    completed: "2026-11"
  - months:
      - 9
    task: "Mulch depth glance: bare soil showing through the bark anywhere along the run = top up that spot with bagged pine bark, keeping it off the blue star fern's surface rhizomes at the bench corner. Still 3cm+ of bark = nothing, it lasts years"
    category: mulch
    completed: 2026-09
log:
  - date: "2026-11-11"
    entry: "Correction (Jay, right): on the young plants horizontal comes first. The plant climbs on its own, so sideways ties along the bottom wires are what fill the base; an upright leader tied early leaves the bottom bare. My climbing-leader job withdrawn. Rule: keep tying sideways; when a shoot heads up by itself, let it reach the next wire and bend it along that one."
    category: general
  - date: "2026-11-11"
    entry: "Spring photo round (IMG_4369-4372): Jay weeded around all three young jasmines after the photos. Mature end at its best. Young plants healthy; the gap is structure: no upright leader on any of them, so a climbing-leader job is set in Do now."
    category: general
  - date: "2026-11-11"
    entry: "Kikuyu ring check at the young plants done (Jay). Young plants also hand-watered this week on top of the feed."
    category: general
  - date: "2026-11-10"
    entry: "Richgro All Purpose fed along the run (Jay fed all three jasmine runs today; light wide dose around the young plants here). Replaces the December growth-push top-up; the second dose is now the January row."
    category: feed
  - date: "2026-11-10"
    entry: "Jay: growth feels stalled after a cool wet spring and hard thinning; one-leader thinning about 80% done and paused while the vine flowers. Advice: normal, the run happens Dec-Feb. Plan: Richgro in the first dry spell (replaces the Dec top-up, a second dose moves to January), finish the thinning now, flowers or not (same day: Jay asked, pause lifted; a competing leader goes even if flowering, a healthy well-placed flowering stem stays), no tipping of wire leaders, steady water. Feed job set on the east card for all three runs."
    category: general
  - date: "2026-11-09"
    entry: "Top-wire recut done on all three runs (Jay): dead stubs and bitten tips cut back to live leaf pairs, regrowth to be tied along the wires. Do-now cleared. Possum nibbling accepted, no deterrent."
    category: prune
  - date: "2026-11-09"
    entry: "Pale May 2026 jasmine checked (Jay): plant doing fine, roots fine. Crown/root check and the 14 Nov colour recheck closed. Nothing more on it; December Richgro light dose is the next feed."
    category: general
  - date: "2026-11-09"
    entry: "Decision (Jay): no possum deterrent, no good product found. Accepting the top-wire nibbling and letting warmer weather push runners higher. Don't re-raise."
    category: general
  - date: "2026-11-09"
    entry: "Pale May 2026 jasmine past the taro stump given PowerFeed at 2ml/L, one can (Jay). Recheck leaf colour against its neighbour on the 14 Nov row."
    category: feed
  - date: "2026-11-09"
    entry: "November cohort-ties session done (Jay): one leader per wire per direction, competing runners rerouted or snipped. Row marked done for November, back on 1 Dec."
    category: prune
  - date: "2026-11-09"
    entry: "Possum confirmed (Jay): droppings along the fence and torn leaf edges on the jasmine. Answers the 27 Oct question: the dead grey top-wire stubs are possum bites, not frost. Brushtails run the fence top and nip the soft flush as they go. Jay: all three runs, top wires getting wrecked."
    category: general
  - date: "2026-10-31"
    entry: "One of the May 2026 plantings past the taro stump has gone pale, not sick, just short of the deep green the rest of the run carries. About 70mm of rain in the week plus every-3-day irrigation on a shallow root zone over the old brick paving, soil cold and sodden, July Richgro spent. Read: cold wet soil locking out nitrogen/iron on a young plant, plus normal light-green spring flush. Plan: 7-day rain delay, bark pulled back from the crown, PowerFeed 2ml/L once the top 5cm is only damp, recheck 14 Nov. No Richgro into wet soil (over-feed history)."
    category: general
  - date: "2026-10-28"
    entry: "Replacement star jasmine planted in the dead plant's spot (second-last toward the back garden), backfilled with a lot of compost. Compost-heavy backfill is fine for jasmine; the one risk is the plant settling as the compost shrinks, so the Nov check looks at the crown height."
    category: plant
  - date: "2026-10-27"
    entry: "Jay's photo IMG_4129: many top-wire tips end in bare grey stubs that look pinched, and Jay has not touched them for months. Two candidates: frost and wind killing the soft tips over winter (dries to a blunt grey end), or possums browsing along the fence top (clean bitten ends, only at fence-top height, droppings on the rail). Either way the dead stub never grows again. Job set on the east card for all three runs: snip each dead tip back to the first healthy leaf pair now, tie the lateral that comes along the wire."
    category: general
  - date: "2026-10-26"
    entry: "Jay's photos IMG_4116-4120 (all three runs): growth on the wires above the fence top is thin, pale and part-bare while the board-backed section below is dense. Verdict: exposure above the fence line (wind both sides, frost in winter, no board for shelter or warmth), not distance from the roots and not the cobwebs. The top wires are already reflushing pale new leaves and buds. Nothing to do beyond the existing tie rows; wilting up top in summer is the first drought signal."
    category: general
  - date: "2026-10-23"
    entry: "Jay: the run was pine-bark mulched about 2-3 months ago (roughly Aug 2026), which never made it onto the card. Logged now. Pine bark lasts 2-3 years, so the November top-up row is deleted and bark is off the shopping list. Next look at mulch depth: spring 2028, or sooner only if bare soil shows."
    category: general
  - date: "2026-10-23"
    entry: Replacement star jasmine bought (Jay, 23 Oct). Planting is the remaining job; row widened to Oct-Nov so it doesn't vanish on 1 Nov.
    category: general
  - date: "2026-10-17"
    entry: "Card audit 17 Oct 2026: cohort ties extended to March."
    category: general
  - date: "2026-10-16"
    entry: "Big spring facelift in progress: ~3 hours a day for a week, 20 hours in, plenty left. Jay is thinning every wire to ONE leader per direction, removing the 2-3 competing green runners that were racing along the same wire. Confirmed as the right structure (a rope of runners shades itself and throws no laterals), with the refinement that losers get rerouted to bare wire or shortened to 2-3 leaves before anything is cut out at the base. Cost: some spring flower lost and coverage starts a few weeks behind, regrows fast in October. From here the monthly cohort-ties pass is a short untwine-and-tie, not another 20 hours."
    category: prune
  - date: "2026-10-07"
    entry: "Pinch rule settled with Jay: runners into bare fence run unpinched (horizontal tie-in does the branching); pinch only over covered fence and above the top wire. Written into the cohort ties rows."
    category: general
  - date: "2026-10-07"
    entry: "Timing-critical session DONE on the laundry side: leaders pinched, supple runners tied into the gaps. Every dead stem from the May collapse ripped out along the run, so the wait-and-see verdict is closed. Same visit: the second-last plant heading toward the back garden is fully dead (never recovered from the May collapse), cut back to the stump. Replacement with a new star jasmine queued for this month; stump comes out first."
    category: general
  - date: "2026-09-16"
    entry: "Jay: the jasmine is really starting to grow again after a run of 20°+ days. Spring flush is on, about a fortnight ahead of a typical year. The 1 Oct timing-critical session stays on its date, but the trigger is length not date: the week the longest new runners hit 30-60cm and still bend easily is the week to go, even if that lands late Sept."
    category: general
  - date: "2026-08-07"
    entry: "Kikuyu cleared around the new plants (IMG_2335/2336) — Jay stripped the runners back to the old brick paving under the grass, rebuilt the bark mulch ring, dripper untouched. Best-effort pass and a good one: on brick the kikuyu can only root shallowly in the joints, so what regrows in spring comes from the joint nodes and the lawn edge above — expect creep back over the mulch by Nov. Plan adapted: no more weeding here for a few months (Jay's call); a 10-min ring-defence task is queued for Nov/Dec instead of runner-by-runner eradication."
    category: general
  - date: "2026-08-06"
    entry: "End-of-winter baseline photos (IMG_2308/2309/2312-2315 — Jay confirmed 2308/2309 are this run, outside the laundry). The laundry end is the run's showpiece: dense mature coverage well above fence height, with the top-wire tie work from the audit visible (fresh figure-8s along the horizontals, ladder shot IMG_2309). New plants climbing from the trough bed look genuinely healthy — dark green, tied in, zero browning; the over-feed is fully behind them. Drip line in place at the base. Two follow-ups: the prune pile at the path's far end goes to the green bin, and runner grass (kikuyu/couch) is creeping into the bed edge along the fence base (IMG_2315) — pull the runners out whole, rooted nodes and all, before spring."
    category: general
  - date: "2026-08-05"
    entry: New plants looking totally healthy — no leaf-edge browning a week after the 29 Jul over-feed triage. Watch closed early; the same-day flush did its job.
    category: general
  - date: "2026-08-05"
    entry: "Scratch test done on the desiccated wall-top/laundry-side stems and the verdict acted on in the same pass — confirmed-dead growth cut back along the run (dead wood felt soggy: normal for 3-month-old dead wood after a wet winter, not a diagnostic red flag; base of plant firm-check queued as a passing glance). Marginal stems deliberately left to see how they fare — October flush decides, cull task added for Oct/Nov. Tie audit finished on this section too."
    category: prune
  - date: "2026-08-04"
    entry: "Pine bark mulched along the whole run from the Daisy's 1m³ 20mm pine bark delivery, same day as the feijoa bed (Jay, 23 Oct 2026: the pile went everywhere it could). Good for 2-3 years."
    category: mulch
  - date: "2026-08-02"
    entry: "Hand-watering tasks for the new plants removed (Jay's call): rain forecast covers the next stretch, irrigation comes on mid-September, and both plants have been on the drip extension since May — the hand-watering schedule was legacy from before the drip install. Watering is now system-level like the rest of the garden."
    category: water
  - date: "2026-07-30"
    entry: Section near the giant taro fed — light dose of Richgro All Purpose, spread wide, not against stems (feed blitz round 2). Whole east run's September feed now replaced.
    category: feed
  - date: "2026-07-29"
    entry: "New plants fed with Richgro All Purpose — heavier than the intended half-handful light dose. Triaged same day: granules pulled away from stems, excess removed, each plant slow-flushed with a full watering can. Watch for leaf-edge browning over the next 2-3 weeks. Section near the giant taro not fed (ran out of fertiliser)."
    category: feed
  - date: "2026-07-22"
    entry: New jasmines watered (5L each) — up to date and looking good.
    category: water
  - date: "2026-05-18"
    entry: "Root zone now well charged (Fri soak + Sun rain). No further watering — risk flipped to cold waterlogging. Recovery/monitor phase: scratch-test stems for survival verdict, hand-strip dead leaves + undo bundled ties anytime, cut only individually-confirmed-dead stems, structural cut-back waits for Jan/Feb. Hold nitrogen feed until spring."
    category: general
  - date: "2026-05-17"
    entry: ~15mm slow soaking rain — excellent deep penetration across the whole run, no runoff. Effectively a second deep soak 2 days after the manual one.
    category: water
  - date: "2026-05-15"
    entry: "Wall-top run crisped from pale to brown/desiccated over ~2 days (photos). Desiccation collapse: cold-night / warm-sunny-day swing — chilled shallow roots couldn't resupply water fast enough on a run of 22°C blue-sky days, dark fence radiating extra heat onto the foliage. Lower foliage + new plants fine. Ruled out eco-seaweed (mild tonic, wrong damage pattern, section was already failing on the 13th)."
    category: general
  - date: "2026-05-15"
    entry: Friday night — deep soak ~50L+ over ~30 min along the whole laundry-side run (not just wall-top). Slow 30-min delivery soaked in well; cold-night downside minor given the volume.
    category: water
  - date: "2026-05-13"
    entry: Wall-top section observed pale/yellow-green compared to other sections. Likely drying out + nutrient draw-down (thinner soil + more sun on wall top). Liquid feed + deep water to-do added. Reassess in 4 weeks.
    category: general
  - date: "2026-05-08"
    entry: Drip extension installed and working. First test, an adjustable shrubbler cap blew off under pressure — swapped both for Holman PC pressure-compensating shrubblers (24 L/hr). Both new plants now on drip.
    category: general
  - date: "2026-05-07"
    entry: On top of hand-watering the 2 new plants while drip extension is being prepped.
    category: water
  - date: "2026-05-06"
    entry: Drip irrigation extension parts purchased. Install pending — extending the existing east drip line to the 2 new plantings before spring turn-on.
    category: general
  - date: "2026-05-01"
    entry: Planted 2 new star jasmines past the giant taro stump, 1m apart. Backfilled with native clay / garden soil / compost mix, watered in, pine bark mulched, tied to fence wires.
    category: plant
