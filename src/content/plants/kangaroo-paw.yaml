name: Kangaroo Paw
type: perennial
location: Front yard, backyard
health: "Ink spot haircut DONE 2 Aug 2026 — front clumps cut to short stubble, infected foliage removed. Clean new fans expected with spring warmth; flowering resumes on the new growth. Watch that regrowth comes through clean — if fresh leaves blacken quickly, flag it."
