notes: "Multiple clumps across front and back. The front clumps are the green strappy fans in the banksia/feijoa bed near the front fence — easily mistaken for dianellas out of flower (ID note: paw leaves are FLAT straps in an iris-like fan; dianella leaves are folded/keeled with a raised midrib). The famous flowers are seasonal stalks that rise out of these fans in late spring/summer — the fans ARE the plant. Ink spot history: April 2026 close-ups were clean, but a heavy outbreak developed over the wet winter (black blotching, permanent on affected leaves). Management regime from 2026: cut whole clumps to ~5cm annually after flowering (or late winter if blackened) — hard cutback is the ink spot treatment AND prevention; paws thrive on it and reflower on new growth. Foliage always to green bin, never compost."
tasks:
  - months:
      - 3
      - 4
    task: "Annual haircut after flowering (scissors): cut each whole clump to ~5cm stubble, spent flower stalks and all. This is the ink spot prevention, not a tidy: a partial trim leaves infected leaves behind. Foliage to the green bin, never compost."
    category: prune
  - months:
      - 9
    task: "Feed: Osmocote Native, standard dose, scattered round each clump and watered in. Native only: the phosphorus in regular fertiliser harms it."
    category: feed
    completed: 2026-07
  - months:
      - 9
    task: "Divide check: congested clump with a dead centre and fewer flower stems = divide."
    category: general
    completed: 2026-09
  - months:
      - 11
      - 12
      - 1
    task: "Ink spot check: black blotches or streaks on the new fans = cut those leaves off at the base and green-bin them. A few marks after a wet spell are normal. A clump more than half blackened gets the full 5cm haircut early."
    category: spray
log:
  - date: "2026-10-16"
    entry: Flowering, lovely paws popping up around the place. Post-haircut regrowth clearly came through clean enough to flower. Nothing to do; enjoy them and run the Nov ink spot glance as scheduled.
    category: general
  - date: "2026-09-17"
    entry: "Irrigation: the back clumps probably get some zone 2 drip (shrubblers found buried and dug out 17 Sept) on top of zone 4; front clumps unchanged on zone 1."
    category: water
  - date: "2026-08-06"
    entry: "End-of-winter baseline photos. Short green shoots pushing through the fresh bark in the feijoa bed (IMG_2279) — if that's the scalped clumps, regrowth is already moving and coming through clean. The full uncut fans by the front fence corner (IMG_2277) turned out to be DIANELLAS (Jay confirmed) — no missed paw clumps, haircut coverage complete. So the front bed holds both: scalped paws mid-bed, groomed dianellas at the fence corner."
    category: general
  - date: "2026-08-04"
    entry: "Pine bark mulched from the Daisy's 1m³ 20mm bark delivery (Jay, 23 Oct 2026: the pile reached every bed bark is appropriate for; this is one of them). Good for 2-3 years, no top-up until bare soil shows."
    category: mulch
  - date: "2026-08-02"
    entry: Ink spot haircut done — front clumps cut to short stubble, foliage binned (photos IMG_2164-2167). Stubble height fine, no need to go lower; only stray uncut leaves at clump edges worth flushing off. Annual post-flowering cutback is now the standing prevention regime.
    category: prune
  - date: "2026-07-31"
    entry: "Ink spot present on the front clumps — extensive black marking on leaves (photos IMG_2108/2109; Jay initially read the clumps as dianellas, but they sit exactly where the paws live and the flat fanned leaves + black blotching fit kangaroo paw ink spot). April's all-clear superseded — the blackening developed over winter. Plan: full 5cm haircut now, bin the foliage, clean regrowth in spring."
    category: general
  - date: "2026-05-06"
    entry: Back clump now tidied (front was done in April). Spent stalks cut to base, dead leaves pulled from centres.
    category: prune
