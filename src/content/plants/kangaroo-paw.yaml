name: Kangaroo Paw
type: perennial
location: Front yard, backyard
zones:
  - 1
  - 2
  - 4
health: "Flowering mid-October 2026: paws popping up around the place (Jay). Spring regrowth after the 2 Aug ink spot haircut came through and is flowering on the new fans. Ink spot check rows from November stand."
healthStatus: good
lastAssessed: 2026-10
