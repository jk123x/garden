name: String of Hearts
type: succulent
indoor: true
location: Front entrance (hanging)
health: OK — sparse trailing, would benefit from a trim and brighter spot
healthStatus: monitor
lastAssessed: 2026-04
image: /images/plants/IMG_0951.jpg
notes: "Ceropegia woodii. Strand coverage is modest — could be denser. A haircut encourages branching. Make sure it gets bright indirect light. Watering: fully dry between drinks, monthly in winter. Brightest indirect spot available."
tasks:
  - months:
      - 9
      - 10
    task: "Haircut for density (5 min): cut the longest strands back by a third to just above a leaf pair, then lay the cut pieces on the soil surface in the same pot and pin them with a bent paperclip. They root at the nodes and thicken the top"
    category: prune
