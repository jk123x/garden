notes: "Aspidistra elatior. Two plants drowning in a large grey pot — way too much soil volume for current root mass. Overwatering is the biggest risk. Relocate to brighter spot and consider repotting into a snug, smaller pot come spring. Watering: two plants in too much soil. Top 5cm dry before a drink, monthly in winter."
