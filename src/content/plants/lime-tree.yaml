name: Lime Tree
type: fruit
location: Backyard
health: "Major renovation prune 22 July 2026: heavy gall wasp infestation discovered — the worst of the four citrus by far — and ~50-65% of canopy removed cutting out clear galls. This chronic gall load explains the years of poor cropping from a big tree. Post-prune photos: open structure, decent green foliage remaining, even flowering. Viable, but in recovery mode — expect a big soft regrowth flush from October (which is also prime gall wasp egg-laying target) and little to no fruit for 12-18 months. Leaf miner history on file; spring flush will need eco-oil."
healthStatus: struggling
lastAssessed: "2026-07"
notes: "Growing next to sage plants near the back deck. LOW-PRIORITY TREE (Jay's call, July 2026): minimal-care regime after the gall renovation prune. Rules: no fertiliser until autumn 2027, no further pruning while it recovers, irrigation covers water. The one standing job is the annual winter gall snip (in tasks) — without it the gall load rebuilds and the tree goes back to producing nothing. Optional extras (whitewash, netting, leaf-miner oil) deliberately dropped. Leaf miner history: cosmetic, ignore. Gall ID rule: sausage swelling mid-stem between joints = gall; swelling at a branch fork = normal wood."
image: /images/plants/IMG_2087.jpg
log:
  - date: "2026-07-30"
    entry: "Eco-oil sprayed alongside the orange. Note: oil has no residual, so the October spring flush still needs its own eco-oil round (leaf miner + the flush being prime gall wasp target) — this spray doesn't cover it. Gall status triple-checked in the same sweep. Still no fertiliser until autumn 2027. Photos IMG_2087/2088: open post-renovation frame holding its remaining foliage fine through winter — sparse as expected, waiting on the spring flush."
    category: spray
  - date: "2026-07-22"
    entry: "Renovation prune: ~50-65% of canopy removed cutting out gall wasp galls — tree was heavily infested, worst of the four citrus. Chronic gall load = the long-standing 'huge tree, few limes' mystery solved. Post-prune: open frame, healthy remaining foliage, flowering. Recovery plan set: no feed this year, tag ambiguous swellings and recheck rather than cut more, whitewash any sun-exposed limbs, optional insect netting Oct-Dec, eco-oil on spring flush, gall check every winter from now on. September feed + prune tasks suppressed for 2026."
    category: prune
  - date: "2026-07-22"
    entry: "Epsom salts drench applied — follow-up on the April magnesium deficiency treatment."
    category: feed
  - date: "2026-07-21"
    entry: "Light clearance prune (only where branches were in the way). Dense healthy dark green canopy in July photos."
    category: prune
