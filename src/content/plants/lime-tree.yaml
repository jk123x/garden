log:
  - date: "2026-10-17"
    entry: "Card audit 17 Oct 2026: sugarcane refresh Oct + Apr added, leaf miner glance Jan/Feb added (limes are the worst hit)."
    category: general
  - date: "2026-10-09"
    entry: "Eco-oil sprayed on the spring flush (leaf miner / gall wasp round, the one that matters after the winter oil wore off). Gall check in the same session: nothing found. Minimal-care regime continues, no feed until autumn 2027."
    category: spray
  - date: "2026-09-17"
    entry: "Irrigation: the lime is on ZONE 2 (the lawn zone), not 4. Its shrubbler was buried; dug out and working 17 Sept, and Jay says it now gets the best coverage of the back citrus. Zone 2 runs 12 min, so the shrubbler gives ~5L a run: fine in spring, a hose job on hot days."
    category: water
  - date: "2026-08-18"
    entry: Bonus eco-oil spray alongside the orange's round 2. Harmless top-up, but it doesn't replace the October flush round — oil has no residual, and the leaf-miner/gall-wasp target is the new spring foliage, which doesn't exist yet. October spray stays on the books.
    category: spray
  - date: "2026-08-06"
    entry: "Compost tuck-under + mulch top-up done (with the other citrus). Note: compost is soil conditioning, not a feed — the no-fertiliser-until-autumn-2027 rule still stands."
    category: mulch
  - date: "2026-08-06"
    entry: End-of-winter baseline photos (IMG_2302/2303 — the sparse young frame near the studio). Holding its remaining foliage through winter as expected; nothing new. October flush + its eco-oil round is the next touchpoint.
    category: general
  - date: "2026-07-30"
    entry: "Eco-oil sprayed alongside the orange. Note: oil has no residual, so the October spring flush still needs its own eco-oil round (leaf miner + the flush being prime gall wasp target) — this spray doesn't cover it. Gall status triple-checked in the same sweep. Still no fertiliser until autumn 2027. Photos IMG_2087/2088: open post-renovation frame holding its remaining foliage fine through winter — sparse as expected, waiting on the spring flush."
    category: spray
  - date: "2026-07-22"
    entry: "Renovation prune: ~50-65% of canopy removed cutting out gall wasp galls — tree was heavily infested, worst of the four citrus. Chronic gall load = the long-standing 'huge tree, few limes' mystery solved. Post-prune: open frame, healthy remaining foliage, flowering. Recovery plan set: no feed this year, tag ambiguous swellings and recheck rather than cut more, whitewash any sun-exposed limbs, optional insect netting Oct-Dec, eco-oil on spring flush, gall check every winter from now on. September feed + prune tasks suppressed for 2026."
    category: prune
  - date: "2026-07-22"
    entry: Epsom salts drench applied — follow-up on the April magnesium deficiency treatment.
    category: feed
  - date: "2026-07-21"
    entry: Light clearance prune (only where branches were in the way). Dense healthy dark green canopy in July photos.
    category: prune
tasks:
  - months:
      - 11
      - 12
      - 1
      - 2
      - 3
    task: "Weekly hose (5 min): once a week Nov-Mar, plus any 35°+ day, hose the lime slowly round the dripline until the top 10cm is wet, about 20L. Its zone 2 shrubbler gives ~5L a run and the zone can never run longer than 15 min for the lawn, so the hose is what carries this tree through summer."
    category: water
  - months:
      - 9
    task: "Late-winter feed (5 min, from 2027 on): Experts Choice fruit & citrus, LIGHT dose under the outer canopy edge, watered in. The tree's first post-renovation feed is the autumn 2027 one, so skip this row until the 2027 autumn feed has happened"
    category: feed
    completed: 2026-07
  - months:
      - 3
    task: "Autumn feed (5 min), the first feed since the 2026 gall renovation: Experts Choice fruit & citrus, LIGHT dose at the dripline, watered in. If the tree is still pushing pale soft shoots, wait a month; feed hardened growth, not the flush."
    category: feed
    completed: 2026-07
  - months:
      - 9
    task: "Light shape prune (10 min, secateurs): only crossing branches and anything dragging on the ground, cuts back to a fork. While recovering from the 2026 renovation, that is the ceiling: the tree needs every leaf it has."
    category: prune
    completed: 2026-07
  - months:
      - 10
    task: "Eco-oil on the spring flush (10 min): spray the new soft leaves until dripping, both sides, on a cool evening under 25°. Leaf miner tunnels the flush and the winter oil has no residual, so this round is its own job. Never spray in heat or full sun: leaf burn."
    category: spray
    completed: 2026-10
  - months:
      - 1
      - 2
      - 3
      - 4
      - 5
    task: "Pick limes (whenever): pick them green and glossy when they feel heavy and give slightly. Left to yellow they go dry"
    category: harvest
    completed: 2026-04
  - months:
      - 6
      - 7
    task: "Annual gall snip (10 min, the one job that matters on this tree): run a hand along every young stem feeling for sausage-shaped swellings. Mid-stem between joints = gall, cut 5cm below it and bin it, never compost (the wasps emerge from it). Swelling at a branch fork = normal wood, leave it. Must be done before spring emergence."
    category: prune
    completed: 2026-07
  - months:
      - 1
      - 2
    task: "Leaf miner glance on the summer flush (2 min): silvery squiggly tunnels in the newest soft leaves = eco-oil both sides of the new growth on a cool evening under 25°, repeat in a week. Old leaves with tunnels are history, ignore them"
    category: spray
