health: "Weeded, composted and sugarcane mulched April 2026 (5cm clear of trunk). Two treatable issues still active: (1) magnesium deficiency — Epsom salts applied April 16, recheck in 2-3 weeks. (2) Citrus leaf miner — silvery tracks and curled leaves. Treat with PestOil fortnightly in spring/summer."
