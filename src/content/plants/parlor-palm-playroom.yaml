notes: "Chamaedorea elegans. Stem has stretched dramatically toward the window, only a small tuft of fronds at the top. Already in the brightest spot available — room just doesn't have enough light for a palm. Stretched stem won't recover; the fix is either a grow light to stop further decline, or a hard prune in Sept to force fresh basal growth. Watering: top 2cm dry, then a drink. LIGHT is the real problem: a stretched parlor palm stem never recovers and must NOT be cut back (palms don't reshoot below a cut, the stem dies). Options are a small LED grow light 6-8 hrs a day or accepting it as is."
