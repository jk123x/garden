name: Parlor Palm (Playroom)
type: palm
indoor: true
location: Playroom
health: "Severely leggy — etiolated single stem from chronic low light"
healthStatus: struggling
lastAssessed: "2026-04"
urgency: week
nextAction: "Add a small LED grow light on a timer (6-8hrs/day) to fix the light deficit, and plan a hard prune in Sept to force fresh growth from the base."
image: /images/plants/IMG_0950.jpg
notes: "Chamaedorea elegans. Stem has stretched dramatically toward the window, only a small tuft of fronds at the top. Already in the brightest spot available — room just doesn't have enough light for a palm. Stretched stem won't recover; the fix is either a grow light to stop further decline, or a hard prune in Sept to force fresh basal growth."
tasks:
  - months: [9, 10, 11, 12, 1, 2]
    task: Feed with liquid fertiliser monthly
    category: feed
