notes: "The big round grey-green domes out the front (Jay calls them the westringias; the one by the porch carries the Christmas lights). Bulletproof, dense, no pest history. They've outgrown their spots, so from 2026 they get a two-pass shape reduction each year: early Sept and March, up to a third each time, never cutting into leafless wood. ID caveat, no action needed: the tiny rounded leaves don't match Westringia fruticosa (which has narrow needle leaves) — Correa alba or bush germander (Teucrium fruticans) are the likely candidates, and a flower photo settles it whenever it flowers. Pruning rules are the same for all three."
