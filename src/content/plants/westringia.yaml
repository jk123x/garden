  - months:
      - 11
    day: 24
    task: "Second can of Eco-Seaweed on both westringia stumps (watering can), over the root zone not the cuts. Nothing else: no fertiliser, no extra water."
    category: feed
  - months:
      - 12
    day: 20
    task: "Westringia stump check, both domes. Scratch a stub with a thumbnail: green and damp under the bark = alive, leave it. New shoots on the stubs or the basal sprigs thickening and leafing up = it has taken, keep the bark off the crown and do nothing until March. Brown and dry under the bark on every stub = the crown is finished and the sprigs are the plant; cut the dead stubs to the ground and keep the sprigs staked. Pull any grass that has come back."
    category: prune
  - months:
      - 3
    task: "Westringia stumps, March (secateurs). Shoots up: tip each new shoot back by a third so it branches, aiming at a loose dome, and cut every dead stub to its base. Stubs still bare: scratch test, brown and dry = cut to the ground and the basal sprigs are the plant. Then a light shear after each flush from here on; because a leafy skin over bare poles is what forced this cut, and shearing little and often stops it building again."
    category: prune
  - months:
      - 9
    task: "Feed: Osmocote Native, standard dose, scattered under the dome at the dripline and watered in. Native fertiliser only, never the Richgro: the phosphorus burns it. Controlled-release, so going early costs nothing."
    category: feed
    completed: 2026-07
