log:
  - date: "2026-09-16"
    entry: "Pass 1 done by Jay (IMG_3713 porch dome, IMG_3714 wattle-side dome). Verdict on the work: correct. Dome shape kept, no flat top, no bare patches or brown showing, clippings are leafy tips not thick stems, so every cut left green below it. Deliberately conservative, nowhere near a third, because we don't yet know how this plant reshoots from older wood. The wattle-side dome stopped short under the wattle's drape; it gets finished in the October wattle-prune session once the shoulder is clear. Follow-up set for 20 Oct: look just below the cut line. New shoots pushing from below the cuts all over = reshoots readily, take the next bite then (toward a third, a little into older wood where a leaf bud shows). No shoots below the cuts = tip-grower only, stay conservative for good. Sweep the cut bits off the brick path and stone slab; on the mulch they're fine."
    category: prune
  - date: "2026-09-08"
    entry: "Jay: the big round front plants have gotten huge, asked whether to cut back yet. Answer: yes, now — early spring shape reduction, up to a third, never into leafless wood, second pass in March. Gallery corrected: IMG_2268 and IMG_2319 removed (a different plant, the needle-leaf lilac-flowered one by the front fence)."
    category: prune
  - date: "2026-08-06"
    entry: "End-of-winter baseline photo (IMG_2272). Dome tight and healthy. Jay confirmed the big dome by the porch in IMG_2272 is this westringia (the one that carried the Christmas lights last year) — I'd initially read it as the muehlenbeckia. (IMG_2268/2319, the needle-leaf lilac-flowered plant by the front fence, were filed here by mistake — Jay 8 Sept: not this plant.)"
    category: general
  - date: "2026-08-04"
    entry: "Pine bark mulched from the Daisy's 1m³ 20mm bark delivery (Jay, 23 Oct 2026: the pile reached every bed bark is appropriate for; this is one of them). Good for 2-3 years, no top-up until bare soil shows."
    category: mulch
