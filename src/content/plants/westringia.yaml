health: "Pass 1 of the size reduction done 16 Sept 2026, conservatively: shape kept, no cuts into bare wood, still well short of a third off. Porch dome finished; the wattle-side dome is unfinished where the wattle drapes over it. Reshoot check 20 Oct decides how hard pass 2 can go. Was: healthy but has outgrown its spot — Jay, 8 Sept 2026: the front domes have 'gotten so huge'. Dense, no dieback. Size reduction is the job, done in two passes (Sept + March) so no cut goes into bare wood."
healthStatus: healthy
