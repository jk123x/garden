log:
  - date: "2026-11-10"
    entry: "Aftercare done on both crowns (Jay): tidied up, 18L watered on each with Eco-Seaweed after a 29° day. One-off soak only; from here zone 1 covers them, no more hand water. Stake skipped as optional. Next: second seaweed can 24 Nov, scratch test 20 Dec."
    category: water
  - date: "2026-11-10"
    entry: "Second dome CUT to about 30cm the same afternoon (IMG_4330/4331): a wide radiating crown of thick poles, all clean cuts, with far more low leafy growth round it than dome 1. Correct cut. Caveat raised on review: dichondra is woven through the front beds, so some of the low green under both domes is groundcover rather than the shrub's own regrowth; the tell is written into the aftercare (round leaf on an upright woody twig = shrub, kidney leaf on a creeping runner = dichondra, pull it 20cm back from the crowns). Decision to do dome 2 now rather than wait for dome 1's verdict: November beats an autumn hard cut. No Christmas lights bush this year. Earlier that day: Jay cut into the centre of a dome for the second bite (IMG_4325-4327): bare poles with leaves only in the outer skin, fresh small-leaved shoots from the base on separate stems, grass through the middle. Advice was a renovation cut, poles to about 30cm. Jay then took the whole dome to the ground (IMG_4328/4329): a woody crown 10-15cm high with clean fresh cuts, two or three leafy basal sprigs beside it, and almost nothing else. Harder than advised but not reversible, and the live sprigs mean the crown has active buds. Aftercare set: stake, bark raked back from the crown, Eco-Seaweed now and again in a fortnight, no extra water. 20 Dec scratch-test row. The porch dome now waits for this stump's verdict before anything beyond a skin shear. Forecast mild all week (17-19°, no heat)."
    category: prune
  - date: "2026-10-30"
    entry: "October pass on the domes done, light again: 10-20% off, Jay held back by the green-below-every-cut rule. He reports leaves coming through lower down across much of the bush, which is the reshoot signal the 20 Oct check was waiting for. Advice: go back now and cut to just above the inner green all over."
    category: prune
  - date: "2026-09-16"
    entry: "Pass 1 done by Jay (IMG_3713 porch dome, IMG_3714 wattle-side dome). Verdict on the work: correct. Dome shape kept, no flat top, no bare patches or brown showing, clippings are leafy tips not thick stems, so every cut left green below it. Deliberately conservative, nowhere near a third, because we don't yet know how this plant reshoots from older wood. The wattle-side dome stopped short under the wattle's drape; it gets finished in the October wattle-prune session once the shoulder is clear. Follow-up set for 20 Oct: look just below the cut line. New shoots pushing from below the cuts all over = reshoots readily, take the next bite then (toward a third, a little into older wood where a leaf bud shows). No shoots below the cuts = tip-grower only, stay conservative for good. Sweep the cut bits off the brick path and stone slab; on the mulch they're fine."
    category: prune
  - date: "2026-09-08"
    entry: "Jay: the big round front plants have gotten huge, asked whether to cut back yet. Answer: yes, now — early spring shape reduction, up to a third, never into leafless wood, second pass in March. Gallery corrected: IMG_2268 and IMG_2319 removed (a different plant, the needle-leaf lilac-flowered one by the front fence)."
    category: prune
  - date: "2026-08-06"
    entry: "End-of-winter baseline photo (IMG_2272). Dome tight and healthy. Jay confirmed the big dome by the porch in IMG_2272 is this westringia (the one that carried the Christmas lights last year) — I'd initially read it as the muehlenbeckia. (IMG_2268/2319, the needle-leaf lilac-flowered plant by the front fence, were filed here by mistake — Jay 8 Sept: not this plant.)"
    category: general
  - date: "2026-08-04"
    entry: "Pine bark mulched from the Daisy's 1m³ 20mm bark delivery (Jay, 23 Oct 2026: the pile reached every bed bark is appropriate for; this is one of them). Good for 2-3 years, no top-up until bare soil shows."
    category: mulch
