notes: "The big round grey-green domes out the front (Jay calls them the westringias; the one by the porch carries the Christmas lights). Bulletproof, dense, no pest history. Structure (seen 10 Nov 2026 when a dome was cut down): the whole dome was long bare grey poles from one small woody crown, with a thin leafy skin at the tips, and the plant regenerates from the crown and base on new stems rather than from the poles. So trimming the skin can never reduce it; reduction means a renovation cut to about 30cm, then shaping the regrowth. The stubs are leafless and that is expected: a renovation relies on dormant buds at the old leaf nodes, not on leaves, so leave pole wood for the buds (10 Nov 2026: dome 1 went to the ground, dome 2 to 30cm, so the two are a built-in comparison). Dichondra runs under these domes: when judging regrowth, count only round leaves on upright woody twigs, not kidney leaves on runners. After a renovation, keep it in bounds with a light shear after each growth flush so a skin never builds again. Hard cuts get Eco-Seaweed, never fertiliser. ID caveat, no action needed: the tiny rounded leaves don't match Westringia fruticosa (narrow needle leaves). Correa alba or bush germander (Teucrium fruticans) were the candidates; the wiry interlaced interior and tiny round leaves also fit Muehlenbeckia astonii (shrubby tororaro, a cousin of the fence vines). All three take a hard cut, and a flower photo settles it whenever it flowers."
