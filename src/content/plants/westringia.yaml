health: "10 Nov 2026: both domes renovated the same day. Dome 1 taken to the ground (IMG_4328/4329), a 10-15cm woody crown with a few leafy basal sprigs. Dome 2 cut to about 30cm (IMG_4330/4331), a wide radiating crown of thick clean-cut poles with plenty of low leafy twigs around it, the better of the two. Caveat: dichondra threads through this bed, so some of the low green under both is groundcover, not the shrub. Verdict on reshooting due 20 Dec."
