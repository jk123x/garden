notes: "Liriope muscari. Clumping ground cover with dark green strappy leaves and purple flower spikes in season. Growing in neat clumps along wooden sleepers, PLUS two clumps at the base of the orange's tub (ID'd Aug 2026, photo IMG_2290) — those two are exempt from the annual shear, Jay's call: leave them alone. Virtually indestructible."
tasks:
  - months:
      - 8
    task: "Annual shear (scissors): cut the sleeper clumps down to 5-8cm before the new spring blades push, tatty old foliage and all. Leave the two clumps at the base of the orange's tub alone (Jay's call). Shear after the new blades are up and you take the tips off fresh growth."
    category: prune
    completed: 2026-07
  - months:
      - 9
    task: "Feed: Richgro All Purpose, light dose, scattered along the sleeper clumps and watered in."
    category: feed
    completed: 2026-07
  - months:
      - 9
    task: "Divide check: dead centre with growth only round the rim = divide. Goes years without needing it."
    category: general
    completed: 2026-09
log:
  - date: "2026-08-07"
    entry: "Two more clumps identified from the winter photos (IMG_2290): the green strappy pair at the base of the orange's tub are lily turf the shear missed — Jay confirmed. His standing call: those two stay unsheared, leave alone."
    category: general
  - date: "2026-08-04"
    entry: "Pine bark mulched from the Daisy's 1m³ 20mm bark delivery (Jay, 23 Oct 2026: the pile reached every bed bark is appropriate for; this is one of them). Good for 2-3 years, no top-up until bare soil shows."
    category: mulch
