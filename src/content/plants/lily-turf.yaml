name: Lily Turf
type: groundcover
location: Sleeper clumps around the native frangipani (lawn edge) + two tub-side clumps by the orange
zones:
  - 2
  - 4
health: Annual cut-back done 30 Jul 2026 — sheared low along the sleepers, fed. Looks stubbly now; fresh spring growth replaces the lot. Was dense and healthy pre-shear.
healthStatus: healthy
lastAssessed: 2026-07
image: /images/plants/IMG_0983.jpg
photos:
  - src: /images/winter-2026/IMG_2290.jpg
