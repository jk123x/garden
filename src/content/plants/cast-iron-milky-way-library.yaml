name: Cast Iron Plant (Milky Way)
type: perennial
indoor: true
location: Library
health: OK — good leaf density, some outer leaves bronzing at edges
healthStatus: monitor
lastAssessed: 2026-04
image: /images/plants/IMG_0944.jpg
notes: "Aspidistra elatior 'Milky Way'. The white speckles are normal — not yellowing. A couple of outer leaves show bronze edges which may indicate over-watering or mineral buildup. Flush soil in autumn and hold off feed. Watering: let it dry well between drinks; bronze leaf edges = too wet or salts."
tasks:
  - months:
      - 4
    task: "Flush the pot (5 min): stand it in the shower and run lukewarm water through until three pots' worth has drained out the bottom. Washes out the fertiliser salts behind the bronze leaf edges. Then no feed until September"
    category: water
