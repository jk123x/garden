notes: Viola hederacea. Australian native ground cover with small round leaves and purple/white flowers. Visible near the stone path in wider backyard shots. Evergreen, handles part shade well, and spreads to fill gaps. Like the dichondra, it's doing its job as living ground cover. A dedicated close-up photo would let us check for any issues.
