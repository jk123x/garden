health: "Scale treatment CLOSED 8 Sept 2026: eco-oil rounds 1 (6 Aug) and 2 (21 Aug) done, ant-traffic check 8 Sept = no ants, cycle broken. A handful of lemons still ripening on the frame. In recovery from the heavy gall-prune: expect a big spring flush, which is prime gall wasp bait — keep feeds light."
