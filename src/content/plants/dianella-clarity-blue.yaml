log:
  - date: "2026-08-06"
    entry: "End-of-winter baseline photos: Jay confirmed the two full strappy clumps by the front fence corner (IMG_2277, next to the feijoa stubs) are dianellas — I'd flagged them as possible missed kangaroo paws. Full foliage post-groom is exactly right for these. One older leaf carries a dark blotch — snip it at the base next time passing, no urgency (dianellas get the groom, never the scalp)."
    category: general
  - date: "2026-08-04"
    entry: "Pine bark mulched from the Daisy's 1m³ 20mm bark delivery (Jay, 23 Oct 2026: the pile reached every bed bark is appropriate for; this is one of them). Good for 2-3 years, no top-up until bare soil shows."
    category: mulch
  - date: "2026-07-31"
    entry: Winter groom done — spent flower stalks and tatty leaves cut at the base (the groom, not the shear). August tidy task satisfied.
    category: prune
notes: "Flax lily (Dianella 'Clarity Blue'). Multiple plants through the front garden providing good structural contrast with the silvery cushion bush and blue chalk sticks. Hardy Australian native that handles Melbourne conditions well. Blue-purple flowers in spring followed by blue berries. One of the lowest-maintenance plants here. ID note (settled July 2026): the green strappy clumps in the banksia/feijoa bed are NOT dianellas — they're the kangaroo paws. True dianella tell: folded/keeled leaf with a raised midrib. Dianellas get the groom (worst leaves at the base), never the 5cm scalp the paws get."
tasks:
  - months:
      - 8
    task: "Winter groom (10 min): cut spent flower stalks and the worst brown or blotched leaves off at the base with scissors. Groom, never scalp: the 5cm shear is for the kangaroo paws, dianellas sulk for a year if you do that"
    category: prune
    completed: 2026-07
  - months:
      - 9
    task: "Feed (2 min): Osmocote Native at the bag rate scattered around each clump, then water in. Never regular fertiliser on these"
    category: feed
    completed: 2026-07
  - months:
      - 9
    task: "Divide check (10 sec): dead centre or clump outgrowing its spot = divide. Dianellas go years without needing it."
    category: general
    completed: 2026-09
