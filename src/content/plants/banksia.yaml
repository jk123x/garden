  - date: "2026-07-29"
    entry: "Native feed blitz done: Osmocote Native applied to all 8 natives (banksia, cinnamon wattle, kangaroo paw, westringia, cushion bush, chalk sticks, dianellas, native daisies). Replaces the September native feeds."
    category: feed
notes: "Native banksia with distinctive cone-like flower heads. July 2026 photos sharpen the ID: low mounding habit, fine needle foliage, round orange-brown brush cones held close to the bush — reads as a dwarf Banksia spinulosa type ('Birthday Candles' or similar cultivar). Grows in the front bed alongside the kangaroo paws and feijoas. The cones develop over weeks, so seeing them at different stages (green through to yellow/brown) is normal, not dieback. Leave spent cones on or snap off for neatness — they're not harmful. Clear leaf litter from around the base to reduce pest habitat. Very low maintenance native, well-suited to Melbourne. Optional, never scheduled: a 5cm tip snip on finished flower stems in spring keeps a dwarf banksia dense. Only if Jay feels like it."
tasks:
  - months:
      - 9
    task: "Feed: Osmocote Native at the bag rate, scattered over the root zone out to the drip line, then water in. Only ever this product: regular fertiliser is high phosphorus and can kill a banksia"
    category: feed
    completed: 2026-07
  - months:
      - 10
      - 3
    task: "Snip the dozen spent cones (scissors). Cut each grey-brown cone off 1-2cm below its base, just above the first green needles. All of them today, rusty orange fuzz included: that fuzz is dried styles, the flower finished in winter. Only a bright yellow cone with soft waxy bristles is live, and there are none in October. Never cut into bare wood. Cones go in the green bin, not under the bush. Photo on Field notes"
    category: prune
  - months:
      - 4
    task: "Mulch: rake out leaf litter and old cones from under the bush first (pest habitat), then top up pine bark to about 5cm over the root zone. Keep a clear hand-width gap around the trunk, mulch touching bark invites collar rot"
    category: mulch
    completed: 2026-04
