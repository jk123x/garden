notes: "Phlebodium aureum 'Blue Star' (golden polypody) — CONFIRMED Aug 2026: identified from the end-of-winter photos, held up under an adversarial second research pass (prostrate banksia, melianthus, cardoon, grevillea seedling all positively excluded on frond architecture), and Jay agreed after his own image comparison. (Tiny residual chance it's the near-identical sibling P. pseudoaureum — same care, horticulturally irrelevant.) Widely sold in Australia for shaded borders, so plausibly a designer pick or past purchase that outgrew its label. Care: basically nothing — it wants exactly what it has. Not invasive; creeps politely and pulls back easily. Two cautions: frost-tender, so a rare hard frost may scorch fronds — they regrow from the rhizome, don't dig it out thinking it's dead; and NEVER bury the surface rhizomes when mulching, they need to sit on top."
tasks: []
log:
  - date: "2026-08-07"
    entry: "ID confirmed and '(probable)' dropped. Second, adversarial research pass at Jay's request: every lookalike a Melbourne designer might plant was tested and rejected (Banksia blechnifolia on leathery herringbone leaves and furry ground stems, Melianthus on saw-toothed leaflets, cardoon on woolly felting, Grevillea robusta seedling on bipinnate toothed division) — the fronds' entire strap lobes, glaucous colour both sides, papery arch, and ground-level colony habit fit only Phlebodium. Jay then confirmed by image comparison. The yellowed frond in the photos is normal senescence, not a problem."
    category: general
  - date: "2026-08-06"
    entry: "Added to the catalogue. Spotted in the baseline photos (IMG_2306) next to the lavender, initially misread as the dusty miller — side-by-side comparison ruled that out (smooth blue fronds vs woolly white), and a research pass settled on blue star fern: glaucous colour, deeply pinnatifid wavy-lobed fronds, creeping-rhizome colony habit, and commonly sold in Melbourne. Rhizome + spore-dot check pending to lock it in."
    category: general
