name: Rudbeckia 'Deamii'
type: perennial
location: Backyard (cutting bed + other beds)
health: "Newly planted May 2026. 3 plants from 100mm pots — 1 in the cutting bed, 2 distributed to other beds. Sugarcane mulch applied. Establishing."
healthStatus: establishing
lastAssessed: "2026-05"
image: /images/plants/cutting-bed.jpg
notes: "Rudbeckia fulgida var. deamii (Deam's Black-eyed Susan). 3 plants total — 1 in the cutting bed, 2 distributed to other beds around the garden. Tough, long-lived perennial that handles Melbourne heat and drought once established. Flowers late summer into autumn on stiff stems — great cut flower. Leave spent seed heads through winter for structure and birds. Cut old stems to ground level in late winter before new basal growth emerges."
tasks:
  - months: [8, 9]
    task: Check for new basal growth emerging
    category: general
  - months: [9]
    task: Feed with complete fertiliser as growth starts
    category: feed
  - months: [3, 4]
    task: Cut spent stems to ground level
    category: prune
  - months: [12, 1, 2, 3]
    task: Cut flowers for the vase — this IS the maintenance
    category: harvest
log:
  - date: "2026-07-21"
    entry: "Raised-bed check (photos): two of the distributed plants healthy with green basal growth. One planting grazed to bare stems — likely slugs/snails harboured by the straw mulch. Crown left in place: winter dieback is normal for these anyway, roots likely alive. Verdict mid-September — replace if no basal shoots by then. Protect crowns with pet-safe iron-based snail bait (cat-safe) and pull mulch back a few cm from crowns."
    category: general
  - date: "2026-05-20"
    entry: "3 plants from 100mm pots. 1 in the cutting bed with echinacea, 2 distributed to other beds. Sugarcane mulch applied."
    category: plant
