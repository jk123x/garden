    entry: "Jay's call: NOT replacing these flowers — the mid-September copper-tub keep-or-replace verdict is cancelled. If the grazed plant regrows, great; if not, oh well. Nothing to check, nothing to buy. The monthly tasks (feed as growth starts, cut for the vase in summer) still apply to whatever comes back."
    category: general
  - date: "2026-08-19"
    entry: "Multiguard re-scattered after the 10 Aug rain washed out the July bait: copper tub, cutting bed, bartlettina ring. Tub shoots covered through to the mid-Sept keep-or-replace verdict."
    category: general
  - date: "2026-08-06"
    entry: End-of-winter baseline photos (IMG_2307 tub, IMG_2288/2289 raised beds). Green shoots visible in the copper tub through the straw — if that's the grazed plant reshooting, the mid-September replace-or-keep verdict is trending keep. Weed seedlings are coming up through the sugarcane in the raised beds — worth a 10-minute hand-pull before they seed, so the crowns aren't competing at spring push.
    category: general
  - date: "2026-07-29"
    entry: "Snail bait done: Multiguard (iron EDTA, cat-safe) scattered in the copper tub and cutting bed. Spring basal shoots protected."
    category: general
  - date: "2026-07-21"
    entry: "Photo check: the distributed plants live in the copper tub planter near the path (Jay confirmed). One grazed to bare stems by snails — straw mulch in the tub is prime snail habitat. Crown left in place: winter dieback is normal anyway, roots likely alive. Verdict mid-September — replace if no basal shoots by then. Protect: scatter cat-safe iron-EDTA snail bait (Multiguard-type) in the tub and pull straw back from the crowns. Healthy basal rosettes also seen in the back-fence raised bed."
    category: general
  - date: "2026-05-20"
    entry: 3 plants from 100mm pots. 1 in the cutting bed with echinacea, 2 distributed to other beds. Sugarcane mulch applied.
