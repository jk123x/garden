notes: Rudbeckia fulgida var. deamii (Deam's Black-eyed Susan). 3 plants total — 1 in the cutting bed, 2 distributed to other beds around the garden. Tough, long-lived perennial that handles Melbourne heat and drought once established. Flowers late summer into autumn on stiff stems — great cut flower. Leave spent seed heads through winter for structure and birds. Cut old stems to ground level in late winter before new basal growth emerges.
tasks:
  - months:
      - 9
    task: "Crown check, then feed only on a yes: green basal shoots showing = one 9L can of half-strength PowerFeed (about 1ml per litre) round the crown, not on it. Nothing showing = leave it alone, no water, no feed"
    category: feed
    completed: 2026-09
  - months:
      - 5
    task: "Cut back: once the flowers are brown and the stems dry, cut every old stem to 3cm above the crown with scissors. Want the seed heads for the birds? Leave them and do this cut in August instead. Never cut the green basal leaves: that is next year's plant."
    category: prune
  - months:
      - 1
      - 2
      - 3
      - 4
    task: "Cut for the vase (whenever): cut stems long, to just above a leaf pair, and take them freely. Cutting is what keeps the plant compact and flowering. Leave a few late heads if you want winter seed heads for the birds."
    category: harvest
log:
