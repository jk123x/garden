notes: "Senecio rowleyanus. Was nearly lost, back now but uneven — some plump pearls, others shrivelled. Algae/moss on the soil surface suggests it's been kept a bit too wet. Watering: only when the pearls start to wrinkle slightly, fully dry in between, monthly in winter. Algae on the soil = it's been too wet. Brightest spot available."
tasks:
