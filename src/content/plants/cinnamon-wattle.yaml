notes: "VARIETY CONFIRMED Aug 2026: Acacia leprosa 'Scarlet Blaze' — the red flowers settle it (the only red-flowered wattle in cultivation; famous Melbourne chance find, floral emblem candidate stuff). Jay loves this tree. What the ID means: naturally semi-weeping with a flexible leader — a slumped, willowy posture is partly just what it does, wind assist or not. It is also SHORT-LIVED: 7-15 years is the realistic span, so enjoy it hard and take cuttings/succession seriously in a few years. Managing the slump: do NOT try to winch it upright (snaps roots on an established tree); instead use the October post-flowering prune to lighten the heavy side and reduce sail so the lean stops progressing. Old stakes sit against the trunk — check any remaining ties aren't girdling and cut them off if the tree is self-supporting at the base. Watch-fors on an aging leprosa: borer holes/gum or sawdust frass on the trunk, and sudden branch dieback — either one is worth a photo. Low phosphorus feeds only."
log:
  - date: "2026-10-28"
    entry: "Prune finished (IMG_4151-4153): whips cut back to about the neighbour's gutter line, cuts landed in leafy wood. Total over the two sessions is about half the foliage, double the plan, mostly from the body and street side. Tree is fine for it in spring, but it is now top-light and leggy and needs every remaining leaf. Rule: nothing more off it until the Oct 2027 post-flowering prune, and that one is a quarter at most. Regrowth check set for 10 Dec."
    category: prune
  - date: "2026-10-28"
    entry: "Prune part one (IMG_4148-4150). Skirt off the westringia: done, the bush has full daylight. Body of the canopy thinned well past the plan, roughly a third to 40% gone including most of the street side that was marked leave. Not yet done: the whips above the neighbour's gutter line and the window arm's tips, which are the two cuts that reduce sail on the kinked trunk. Rule from here: no more off the body this year, finish the tops only."
    category: prune
  - date: "2026-10-26"
    entry: "Jay sent post-flowering photos (IMG_4121-4123) asking how hard to cut. Healthy, dense, flowering finished. Plan marked up on Field notes: about a quarter off, from three places (whips topped at the neighbour's gutter line, the window arm back to the house corner, the dome skirt lifted 30-50cm), kink and street side untouched."
    category: general
  - date: "2026-10-17"
    entry: "Card audit 17 Oct 2026: autumn borer check added."
    category: general
  - date: "2026-08-17"
    entry: "De-staked: slack straps cut off, broken stakes pulled, trunk debris cleared. Pressure ridge on the bark heals itself as the trunk thickens — glance once a season. Next touchpoint is the October post-flowering prune (lighten the heavy side, clear the westringia's shoulder)."
    category: general
  - date: "2026-08-08"
    entry: "Stake + trunk inspection from Jay's close-ups (IMG_2338-2342). Trunk healthy: smooth clean bark, no borer holes, gum or frass. But the old staking is now junk-plus-hazard: stakes broken (splintered ends wedged in the canopy and against the trunk) and several wide fabric straps still wrapped on the trunk/low branches — one pressure ridge already visible along the trunk where a strap has been biting. 10-min job, anytime: cut off every slack strap, pull the broken stakes, clear debris from around the trunk. Caution: nudge-test each piece first — if one is actually load-bearing on the leaning trunk (goes tight when pushed), leave that single piece until the October prune lightens the canopy, then remove. Pressure-marked bark heals itself as it thickens; no sealant. Glance at the ridge once a season."
    category: general
  - date: "2026-08-08"
    entry: "Jay flagged scattered yellowing phyllodes (photo IMG_2337). Zoom verdict: normal turnover, not a problem — the yellow ones are older inner phyllodes, each uniformly yellow, scattered as singles through a dense canopy that's carrying a huge bud load. Wattles shed old foliage year-round and it spikes just before/during mass flowering (resources go to the flowers) and after a wet winter. Expect MORE yellow-and-drop during and after the show — still normal. Care = nothing active: no extra feed (Sept feed already done, low-P only ever), no winter watering, mulch kept off the trunk. The two triggers that WOULD matter: yellowing concentrated on one whole limb that then wilts (borer check — gum bleeds, sawdust frass, holes) or the entire canopy going pale at once (drainage). Neither is present. Also noted: the drape over the westringia is fine until October — at the post-flowering prune, remove the branches resting on the dome (cut back to a green lateral, never a bare-wood stub) so its shoulder gets light back."
    category: general
  - date: "2026-08-06"
    entry: "VARIETY LOCKED IN: 'Scarlet Blaze' — Jay confirmed, and the photo zooms show the red pompoms already opening along the branchlets. Health evaluation off the baseline photos (IMG_2265/2271 + crops): dense healthy canopy, clean bark (no borer holes, gum or cracks visible at the trunk or unions), heavy flower load = good vigour. The wind-incident slump is structural only — the tree has kept growing and flowering at its new angle, and semi-weeping posture is native to this cultivar anyway. Plan: don't pull it upright; use the October post-flowering prune to lighten the heavy side so the lean doesn't progress; check the old stake ties at the trunk aren't girdling; keep a casual eye out for borer frass as it ages (short-lived species, 7-15yr)."
    category: general
  - date: "2026-08-04"
    entry: "Pine bark mulched from the Daisy's 1m³ 20mm bark delivery (Jay, 23 Oct 2026: the pile reached every bed bark is appropriate for; this is one of them). Good for 2-3 years, no top-up until bare soil shows."
    category: mulch
tasks:
  - months:
      - 10
    day: 20
    task: "Prune after flowering (secateurs, scissors on thin tips). A quarter of the canopy at most, never more: whips above the neighbour's gutter line back to a green side shoot, anything resting on the westringia lifted 30-50cm clear, tips touching the window back to a green side shoot. Every cut just above green, wattles don't reshoot from bare wood. Nothing at or below the Z-kink, leave the lean alone"
    category: prune
    completed: "2026-10"
  - months:
      - 12
    day: 10
    task: "Regrowth check after the October prune: look at the end of every cut arm for new shoots behind the cut. New growth everywhere = done, nothing else this year. An arm with no new shoots and browning leaves = cut it back to the next live side shoot; gum, sawdust or a round hole on it = borer, photo it"
    category: general
  - months:
      - 9
    task: "Feed: Osmocote Native at the bag rate over the root zone out to the drip line, then water in. Only ever this product, wattles are phosphorus-sensitive"
    category: feed
    completed: 2026-07
  - months:
      - 4
    task: "Mulch: top up to about 5cm over the root zone, keeping a clear hand-width gap around the trunk. While there, glance at the old strap pressure ridge on the trunk: bark healing over it is fine, gum or sawdust there is a borer sign worth a photo"
    category: mulch
    completed: 2026-04
  - months:
      - 3
    task: "Borer check: look at the trunk base and the big branch forks for sawdust frass, weeping gum or a neat round hole. Found = push a wire in to kill the grub, or cut the branch off below the damage. Borers are what shortens a wattle's life"
    category: general
