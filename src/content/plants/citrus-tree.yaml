name: Citrus Tree (Backyard)
type: fruit
location: Backyard
health: "Scale treatment COMPLETE: eco-oil rounds 1 (30 Jul) and 2 (18 Aug) both done. Verdict phase: watch ant traffic on trunk/fruit over the next fortnight — dropping = won; still busy trails in early Sept = a third oil round. Fed (Experts Choice light) + Epsom drenched July; gall wasp triple-checked. Background: heavy ripe orange crop, interveinal yellowing on older leaves from fruit load + winter drawdown (Mg/N — expected, don't re-treat)."
healthStatus: monitor
lastAssessed: "2026-07"
urgency: week
readyFrom: "2026-09-01"
dueBy: "2026-09-07"
nextAction: "Ant-traffic check (30 sec): trails on the trunk/fruit gone or way down = scale beaten, done. Still busy = one more eco-oil round. Dead scale stays stuck on — thumbnail flick: dry and flaky = dead. Pick ripe oranges as they come."
notes: "Larger backyard citrus near the sage. The leaf colour and density are genuinely good — this tree is getting what it needs. The Mexican Sage is growing right into its canopy though, which reduces airflow. When the sage gets its post-flowering cutback, that'll create space. Keep up regular feeding — citrus are heavy feeders. Last fed April 15 2026 — had been 2 months since the previous feed. Keep to a regular 6-8 week feeding schedule through the growing season."
