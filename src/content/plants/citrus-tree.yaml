name: Citrus Tree (Backyard)
type: fruit
location: Backyard
health: "Scale treatment underway: eco-oil round 1 sprayed 30 Jul, second spray due mid-Aug, watching ant traffic as the success signal. Fed (Experts Choice light) + Epsom drenched July; gall wasp triple-checked. Background: heavy ripe orange crop, interveinal yellowing on older leaves from fruit load + winter drawdown (Mg/N), ants + sooty smudges = scale being farmed. Light clearance prune done July."
healthStatus: monitor
lastAssessed: "2026-07"
urgency: later
nextAction: "Second eco-oil spray ~13-20 Aug (2-3 weeks after the 30 Jul round 1) — catches crawlers that hatch after round 1; fine if it slips a week. Judge round 1 by ant traffic dropping, not by scale falling off (dead scale stays stuck on — thumbnail flick: dry and flaky = dead). Pick ripe oranges as they come."
notes: "Larger backyard citrus near the sage. The leaf colour and density are genuinely good — this tree is getting what it needs. The Mexican Sage is growing right into its canopy though, which reduces airflow. When the sage gets its post-flowering cutback, that'll create space. Keep up regular feeding — citrus are heavy feeders. Last fed April 15 2026 — had been 2 months since the previous feed. Keep to a regular 6-8 week feeding schedule through the growing season."
