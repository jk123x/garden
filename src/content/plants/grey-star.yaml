notes: "Ctenanthe setosa 'Grey Star'. Leaves curling inward as a drought/dry-air response. Purple undersides are normal. Keep away from any heating or air vents — dry air is the enemy. Watering and air: never let it fully dry, bottom-water weekly in winter. Dry air curls the leaves; keep it away from vents, pebble tray or a stint in the bathroom if edges crisp."
