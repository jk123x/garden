notes: "Growing along the back path near a window. The woody base is the main issue — lavender becomes permanently leggy if not pruned regularly, and once stems go bare they won't regrow leaves from old wood. Cut each stem to the lowest point with green leaves — never into bare wood. After cutting, watch stubs over 4-6 weeks: stubs that push new leaves are alive; stubs that stay brown and dry are dead and can be snipped flush later. Tidy second cut to balance shape in September once regrowth pattern is visible. Photo IMG_1004.jpg currently attached looks like the wrong plant (lance-shaped leaves, not lavender needles) — needs replacing with a real photo."
