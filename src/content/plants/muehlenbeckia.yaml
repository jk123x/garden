name: Muehlenbeckia (South fence)
type: climber
location: South (street) fence
zones: [1]
health: "Top reduction done 8 Sept 2026 (scissors + secateurs), possibly including some thick feeder stems. Watch for strands wilting then browning over the next 2-3 weeks: that's a severed run, pull it once crispy and tie a live runner into the gap. Coverage still patchy on the lower half; thickening is the job, not reach."
