notes: "Wire vine / maidenhair vine / mattress vine (Muehlenbeckia complexa). This is the SOUTH (street) fence vine; long-term it and the east (neighbour) fence vine grow toward each other and meet at the corner. The established section of front fence is well-covered with dense fine foliage. The brown material inside the mass is normal — muehlenbeckia grows so densely that interior growth dies from lack of light. Can be given a hard haircut if it gets too wild. Vigorous grower that's hard to kill."
tasks:
  - months: [12, 3]
    task: "Tie check (5 min, scissors): the Sept garden ties were guides, not permanent. Undo each one in turn. Stem stays flat on the fence by itself (its laterals have wrapped the wire) = leave the tie off. Stem springs away = re-tie it loose. Also cut off any tie that is biting into a stem. Every Sept tie should be off by the end of March; a tie left on for a year girdles the stem."
    category: general
  - months: [9]
    day: 28
    task: "Dieback check after the 8 Sept trim (2 min): any strand with wilted or browned leaves while its neighbours are flushing = a run severed by the trim. Pull it out once it's dry and crispy, then tie a live runner across the gap. Green everywhere = nothing to do"
    category: general
  - months: [10, 11, 12, 1, 2, 3]
    task: "Monthly top shear (10 min): risers off flush, cap tight to the fence line — monthly is the sweet spot; the vine needs ~a month to convert each shear into new laterals, so more often just re-cuts the same growth. While there, tie down any long strand that reaches bare grate and pinch its tip"
    category: prune
  - months: [3, 9]
    task: "Season trim (20 min): cut the top cap back tight to the fence line on both faces, snip the street-side escapees flush with the wires, and cut out any strand that is dry and snaps clean (bendy = alive, leave it). Scissors for handfuls of green, secateurs for stiff dark stems. Rake the clippings off the succulents below."
    category: prune
    completed: "2026-07"
  - months: [9]
    task: "Feed (5 min): Richgro All Purpose, normal dose, scattered along the fence base over the root zone and watered in. Go the last calm weekend before spring: any earlier and winter rain leaches it past sleeping roots."
    category: feed
    completed: "2026-07"
  - months: [12]
    task: "Growth-push top-up: second dose of Richgro — the July feed is spent by now; this fence is being pushed for full coverage"
    category: feed
log:
  - date: "2026-09-17"
    entry: "Jay tied a good number of garden ties along the fence to guide the stems into a coverage skeleton. Vine is cut back hard everywhere but well guided. Ties are temporary: the vine holds itself once laterals wrap the wire, so the Dec + Mar tie-check rows decide tie by tie when each comes off."
    category: general
  - date: "2026-09-08"
    entry: "Follow-up same afternoon: more risers tied down into the bare panels, deep hand-water at the crowns. Next touch is the late-Sept dieback check, then the Oct shear."
    category: general
  - date: "2026-09-08"
    entry: "After-trim photos (IMG_3493-3496). Verdict: about right, not too far. Cap reduced to a 20-30cm band on the rail with no cuts into the dark core; plenty of leaf left. Loose risers still wave above the rail (garden side + gate post) and the west end lower panel is near-bare. Advice: don't cut harder today (plant is dry-stressed and not yet flushing); pull the leftover risers down and tie them into the bare grate instead of snipping, then rake clippings off the cotyledon/dusty miller. Tighter cap at the Oct shear once new growth shows. Deep hand-water at each crown now."
    category: prune
  - date: "2026-09-08"
    entry: "Trim done by Jay (scissors, some secateurs). He may have cut several thick feeder stems mid-fence. Advice: no disaster, the plant reshoots from old wood and the crowns are untouched, but any run past a cut will die back and reset that section's coverage. Soil was dry (weeds hard to pull) despite 42mm over the fortnight: one deep hand-water at the base of each vine, then nothing until the Oct irrigation turn-on. Dieback watch set for late Sept."
    category: prune
  - date: "2026-09-08"
    entry: "Pre-trim photos both sides (IMG_3486-3490) confirm the 2 Sept read: top-heavy cap, pale risers, bare lower grates, west end by the gate the sparsest. Trim plan given: salvage long risers into the bare panels first (tie loose, pinch tips), then shear the cap, snap-test the low wiry strands before cutting any, snip street-side escapees, rake clippings off the succulents."
    category: prune
  - date: "2026-09-02"
    entry: "Early-spring photo check (IMG_3407): top-heavy — dense overhanging cap plus risers reaching for sun, lower/mid grates still bare wiry skeleton. Jay has been tying runners low and toward the sparse west end. Verdict: cut the top NOW rather than let it grow out — apical dominance means the top keeps winning until it's removed; spring regrowth hides the cuts within weeks."
    category: prune
  - date: "2026-08-06"
    entry: "End-of-winter baseline photos (IMG_2270/2274). Fence coverage looks full and healthy going into spring. (Correction from Jay: the big freestanding dome by the porch in IMG_2272 is the westringia, not this plant.) Note: runners are threading through the front fence onto the nature strip side (IMG_2276) — snip the escapees when passing so they don't get mowed into a mess."
    category: general
  - date: "2026-07-29"
    entry: "Tidied and trimmed — September trim front-loaded. Fed with Richgro All Purpose 29 Jul — September feed replaced."
    category: prune
