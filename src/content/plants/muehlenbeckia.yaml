name: Muehlenbeckia
type: climber
location: Front fence (other side)
health: "Tidied and trimmed July 2026. Skeleton now reaches every grate on the fence but much of it is a single strand — coverage is patchy, especially the bottom half. Thickening is the job now, not reach."
healthStatus: good
lastAssessed: "2026-09"
urgency: week
nextAction: "Top reduction (15-20 min): shear the sun-seeking risers flush with the fence top and take ~1/3 off the overhanging cap so it sits tight to the fence line — the top is hogging the energy that should be filling the bare lower grates. Salvage rule: a long strand that pulls free easily AND reaches bare grate gets tied down low + tip pinched off (pinching stops it climbing back up and forces side shoots along the tied length); anything tangled or short just gets cut. Snip the nature-strip escapees while there."
image: /images/plants/IMG_0954.jpg
photos:
  - src: /images/winter-2026/IMG_2270.jpg
    caption: "Climbing the fence corner by the bins (6 Aug 2026)"
  - src: /images/winter-2026/IMG_2274.jpg
    caption: "Draping the deck edge, miscanthus tuft below (6 Aug 2026)"
  - src: /images/winter-2026/IMG_2276.jpg
