    entry: "Jay: a massive council tree on the nature strip hangs over this fence, which explains the reaching. Plan revised: fortnightly reacher snips in spring, December feed cut to light, effort concentrated on the lighter stretches, darkest section allowed to stay thin, heat-day wilt glance added."
    category: general
  - date: "2026-10-23"
    entry: "Jay: strands have untwined from the Sept ties and are reaching out from the fence for light. Advice: shear every reacher to 5-10cm outside the wires, scissors, as often as seen; don't re-tie reachers; leave anything running flat along the fence. Rule written into notes and the monthly rows."
    category: general
  - date: "2026-10-17"
    entry: "Card audit 17 Oct 2026: stale Sept dieback-check row deleted."
    category: general
  - date: "2026-10-07"
    entry: "October monthly shear DONE (IMG_3925/3926): Jay tied more strands down toward the bare lower grate first, then cut the top back a fair way. Photos: cap sheared flat along the rail, upper half dense and holding green, lower half still an open net of strands over visible grate. Nothing needed, because the lower fill is exactly what the tie-downs are for and the next shear is November's row. Corner by the gate post (IMG_3927) has runners led along the top rail toward the post with bare grate beyond it: that is the west fence's job to fill from its side."
    category: prune
  - date: "2026-09-17"
    entry: "Jay tied a good number of garden ties along the fence to guide the stems into a coverage skeleton. Vine is cut back hard everywhere but well guided. Ties are temporary: the vine holds itself once laterals wrap the wire, so the Dec + Mar tie-check rows decide tie by tie when each comes off."
    category: general
  - date: "2026-09-08"
    entry: "Follow-up same afternoon: more risers tied down into the bare panels, deep hand-water at the crowns. Next touch is the late-Sept dieback check, then the Oct shear."
    category: general
  - date: "2026-09-08"
    entry: "After-trim photos (IMG_3493-3496). Verdict: about right, not too far. Cap reduced to a 20-30cm band on the rail with no cuts into the dark core; plenty of leaf left. Loose risers still wave above the rail (garden side + gate post) and the west end lower panel is near-bare. Advice: don't cut harder today (plant is dry-stressed and not yet flushing); pull the leftover risers down and tie them into the bare grate instead of snipping, then rake clippings off the cotyledon/dusty miller. Tighter cap at the Oct shear once new growth shows. Deep hand-water at each crown now."
    category: prune
  - date: "2026-09-08"
    entry: "Trim done by Jay (scissors, some secateurs). He may have cut several thick feeder stems mid-fence. Advice: no disaster, the plant reshoots from old wood and the crowns are untouched, but any run past a cut will die back and reset that section's coverage. Soil was dry (weeds hard to pull) despite 42mm over the fortnight: one deep hand-water at the base of each vine, then nothing until the Oct irrigation turn-on. Dieback watch set for late Sept."
    category: prune
  - date: "2026-09-08"
    entry: "Pre-trim photos both sides (IMG_3486-3490) confirm the 2 Sept read: top-heavy cap, pale risers, bare lower grates, west end by the gate the sparsest. Trim plan given: salvage long risers into the bare panels first (tie loose, pinch tips), then shear the cap, snap-test the low wiry strands before cutting any, snip street-side escapees, rake clippings off the succulents."
    category: prune
  - date: "2026-09-02"
    entry: "Early-spring photo check (IMG_3407): top-heavy — dense overhanging cap plus risers reaching for sun, lower/mid grates still bare wiry skeleton. Jay has been tying runners low and toward the sparse west end. Verdict: cut the top NOW rather than let it grow out — apical dominance means the top keeps winning until it's removed; spring regrowth hides the cuts within weeks."
    category: prune
  - date: "2026-08-06"
    entry: "End-of-winter baseline photos (IMG_2270/2274). Fence coverage looks full and healthy going into spring. (Correction from Jay: the big freestanding dome by the porch in IMG_2272 is the westringia, not this plant.) Note: runners are threading through the front fence onto the nature strip side (IMG_2276) — snip the escapees when passing so they don't get mowed into a mess."
    category: general
  - date: "2026-08-04"
    entry: "Pine bark mulched from the Daisy's 1m³ 20mm bark delivery (Jay, 23 Oct 2026: the pile reached every bed bark is appropriate for; this is one of them). Good for 2-3 years, no top-up until bare soil shows."
    category: mulch
  - date: "2026-07-29"
