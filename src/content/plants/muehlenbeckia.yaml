notes: "Wire vine / maidenhair vine / mattress vine (Muehlenbeckia complexa). This is the SOUTH (street) fence vine; long-term it and the east (neighbour) fence vine grow toward each other and meet at the corner. The established section of front fence is well-covered with dense fine foliage. The brown material inside the mass is normal — muehlenbeckia grows so densely that interior growth dies from lack of light. Can be given a hard haircut if it gets too wild. Vigorous grower that's hard to kill. REACHERS RULE (Jay, 23 Oct 2026): any strand standing off the fence chasing light gets cut back to 5-10cm outside the wires with scissors, whenever seen, no monthly limit (the monthly ceiling is for the full-face top shear only). Never re-tie a reacher, the tip pulls out again; ties are for laying a strand along bare fence. Each cut reacher branches into 2-3 fence-hugging laterals, which is the coverage. Why a stub and not flush (Jay asked, 23 Oct): the 5-10cm stub carries the nodes the new laterals grow from, cut flush and regrowth comes slowly from old wood as one shoot. The stub is the thickness of the finished mat, not a gap. Over sections that are ALREADY dense, cut flush to the face, that is the top shear. STREET TREE (Jay, 23 Oct 2026): a massive council tree on the nature strip hangs over this fence. It is why the vine reaches: the face is shaded and the tree's roots take the zone 1 water first. Plan adjusted: reachers get snipped fortnightly in spring, the Dec feed is LIGHT (feeding in shade grows reachers), leaders and ties go into the lighter stretches (top wire, the ends toward the corner), the darkest section under the canopy is allowed to stay an open scramble. Target is an even thin cover along the whole run, not dense patches. Wilting on a 35° day while east/west fences don't = tree root competition, zone 1 to 20 min that week. Council clearance prune can be requested, low odds."
tasks:
  - months:
      - 12
      - 3
    task: "Tie check (scissors): the Sept garden ties were guides, not permanent. Undo each one in turn. Stem stays flat on the fence by itself (its laterals have wrapped the wire) = leave the tie off. Stem springs away = re-tie it loose. Also cut off any tie that is biting into a stem. Every Sept tie should be off by the end of March; a tie left on for a year girdles the stem."
    category: general
  - months:
      - 10
      - 11
      - 12
      - 1
      - 2
      - 3
    task: "Monthly top shear: risers off flush, cap tight to the fence line — monthly is the sweet spot; the vine needs ~a month to convert each shear into new laterals, so more often just re-cuts the same growth. While there, tie down any long strand that reaches bare grate and pinch its tip Reachers (strands standing off the fence chasing light): cut to 5-10cm outside the wires whenever seen, don't re-tie them"
    category: prune
    repeat: monthly
    completed: 2026-10
  - months:
      - 3
      - 9
    task: "Season trim: cut the top cap back tight to the fence line on both faces, snip the street-side escapees flush with the wires, and cut out any strand that is dry and snaps clean (bendy = alive, leave it). Scissors for handfuls of green, secateurs for stiff dark stems. Rake the clippings off the succulents below."
    category: prune
    completed: 2026-07
  - months:
      - 9
    task: "Feed: Richgro All Purpose, normal dose, scattered along the fence base over the root zone and watered in. Go the last calm weekend before spring: any earlier and winter rain leaches it past sleeping roots."
    category: feed
    completed: 2026-07
  - months:
      - 12
    task: "Growth-push top-up, LIGHT: half a handful of Richgro spread along the fence base, half the normal dose. This fence sits under the street tree, and feeding a shaded vine mostly grows long soft reachers. The east and west fences get the normal dose, not this one"
    category: feed
  - months:
      - 12
      - 1
      - 2
    task: "Heat-day glance: on a 35°+ day, look at this run against the east and west fences. Wilting here and not there = the street tree's roots are taking the zone 1 water. Zone 1 to 20 min for that week, then back to 15. No hosing out the front"
    category: water
log:
