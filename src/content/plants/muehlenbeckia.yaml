  - src: /images/plants/IMG_0954.jpg
    caption: "July 2026, after the tidy"
notes: "Wire vine / mattress vine (Muehlenbeckia complexa). The established section of front fence is well-covered with dense fine foliage. The brown material inside the mass is normal — muehlenbeckia grows so densely that interior growth dies from lack of light. Can be given a hard haircut if it gets too wild. Vigorous grower that's hard to kill."
tasks:
  - months: [10, 11, 12, 1, 2, 3]
    task: "Monthly top shear (10 min): risers off flush, cap tight to the fence line — monthly is the sweet spot; the vine needs ~a month to convert each shear into new laterals, so more often just re-cuts the same growth. While there, tie down any long strand that reaches bare grate and pinch its tip"
    category: prune
  - months: [3, 9]
    task: Trim to shape
    category: prune
    completed: "2026-07"
  - months: [9]
    task: Feed with slow-release fertiliser
    category: feed
    completed: "2026-07"
  - months: [12]
    task: "Growth-push top-up: second dose of Richgro — the July feed is spent by now; this fence is being pushed for full coverage"
    category: feed
  - months: [12, 1, 2]
    task: Water in extended dry periods
    category: water
log:
  - date: "2026-09-02"
    entry: "Early-spring photo check (IMG_3407): top-heavy — dense overhanging cap plus risers reaching for sun, lower/mid grates still bare wiry skeleton. Jay has been tying runners low and toward the sparse west end. Verdict: cut the top NOW rather than let it grow out — apical dominance means the top keeps winning until it's removed; spring regrowth hides the cuts within weeks."
    category: prune
  - date: "2026-08-06"
    entry: "End-of-winter baseline photos (IMG_2270/2274). Fence coverage looks full and healthy going into spring. (Correction from Jay: the big freestanding dome by the porch in IMG_2272 is the westringia, not this plant.) Note: runners are threading through the front fence onto the nature strip side (IMG_2276) — snip the escapees when passing so they don't get mowed into a mess."
    category: general
  - date: "2026-07-29"
    entry: "Tidied and trimmed — September trim front-loaded. Fed with Richgro All Purpose 29 Jul — September feed replaced."
    category: prune
