notes: "Likely Rhipsalis baccifera (Mistletoe Cactus) — thin needle-like green stems in a pale yellow rounded pot, suspended in a white macramé hanger. ID not fully confirmed; could also be a fine-stemmed Rhipsalis variety like R. cassutha. Update slug/name once identified."
tasks:
