image: /images/plants/giant-taro.jpg
notes: "Alocasia, species TBC — most likely Alocasia 'Calidora' or Alocasia × portora (macrorrhizos × odora hybrid) given the combination of thick brown tree-like trunk with rounded matte leaves. Could also be Alocasia macrorrhizos. Confirm species by checking trunk texture (smooth-fibrous vs scarred-rough) and whether it ever flowers (odora flowers are strongly fragrant at night). Wear gloves and long sleeves when cutting — sap contains calcium oxalate crystals, severe skin/eye irritant. Multiple stems = original plant + established offsets. To keep permanently smaller, dig out side pups when cutting back. Watch for any regrowth from missed root pieces and cut at ground level early."
