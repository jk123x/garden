  - date: "2026-08-06"
    entry: "End-of-winter baseline photos (IMG_2310). Kept trunk carrying two big healthy leaves through winter. The small arrowhead-leaf seedlings in the mulch around the base: Jay confirmed they're just more taro — regrowth pups from root pieces missed in the April dig. DECISION: Jay will pull them all out at some point, no rush — it stays on the weeding round-2 list as the low-urgency item (gloves and long sleeves for the sap; easier now while small than after a spring growth spurt)."
