notes: "Grapefruit — ID confirmed by Jay July 2026 (was 'unknown backyard citrus'). Fairly big tree out the back, near the deck. The pale lime-green tone compared to the orange suggests it's not getting enough nutrients — being treated with regular feeds + Epsom. Same citrus care as the others: light Experts Choice doses only (gall wasp caution), gall checks each winter/spring."
log:
  - date: "2026-10-22"
    entry: "Jay: leaves looking pretty pale after the recent heat and the big prune. Advice: heat doesn't bleach citrus. New-growth-only pale = normal flush, leave it. Old leaves pale with green veins = Epsom once. Old leaves fading evenly = nitrogen, December Experts Choice brought forward at half rate (gall wasp season). Check set as the do-now."
    category: general
  - date: "2026-10-17"
    entry: "Card audit 17 Oct 2026: gall check moved to Jul/Aug, sugarcane refresh Oct + Apr added, leaf miner glance and Epsom check added."
    category: general
  - date: "2026-10-09"
    entry: "Sunshade clearance prune done: watershoots wrapping the retractable shade cut out. October gall check done, no galls found. Dec/Feb re-wrap checks stay on the card. No more cutting this year."
    category: prune
  - date: "2026-10-07"
    entry: "Jay: the tree has grown really tall and is wrapping around the retractable sunshade (extended each morning, retracted each evening). Spring regrowth from the August hard prune, mostly vertical watershoots. Clearance prune row added for October plus Dec/Feb re-checks; clearance only, the no-more-renovation-cuts-this-year rule stands."
    category: prune
  - date: "2026-09-05"
    entry: "Jay confirmed the backyard fruit trees were cut back hard recently (the heavy Aug prune session). September 'light prune to shape' marked done — no further pruning this year. Hard-prune caveats: light feeds only, Oct gall check matters more than usual."
    category: prune
  - date: "2026-08-06"
    entry: "Compost tuck-under DONE (all four citrus): sugarcane pulled back, compost on the root zone clear of the trunk, mulch topped up over it. The trees are set for the spring push — nothing owed now until the summer feed round."
    category: mulch
  - date: "2026-08-06"
    entry: "End-of-winter baseline photos — Jay confirmed IMG_2291/2292 are this tree (the multi-trunk one in the tub by the bins; I'd filed them under the orange, and the tall tree in IMG_2288 is the native frangipani, not this). State: canopy dense with fruit ripening — taste-test season is open, they sweeten with hang time. The pale/interveinal mottling on older leaves matches this tree's known magnesium story; Epsom was drenched in July, and the verdict shows in the NEW spring growth, not the old leaves — don't re-treat off these photos. Compost tuck-under still pending delivery."
    category: general
  - date: "2026-07-30"
    entry: "Fed with Experts Choice, light dose — September feed replaced. Gall wasp triple-checked: clean, no galls found. Tree has always had strong growth. Decision: no preventive treatments — eco-oil is contact-only with no residual (pointless without scale present) and there's nothing to gall-prune. Stays on the annual winter gall check; lush growth is what wasps target, so keep feeds light."
    category: feed
  - date: "2026-07-29"
    entry: "Variety confirmed: grapefruit. Renamed from 'Citrus Tree (Backyard, small)'."
    category: general
  - date: "2026-07-21"
    entry: Epsom salts drench applied — leaves still pale, treating for magnesium alongside the big backyard citrus.
    category: feed
tasks:
  - months:
      - 9
    task: "Late-winter feed (5 min): Experts Choice fruit & citrus, LIGHT dose, scattered under the outer canopy edge (not against the trunk) and watered in. Light on purpose: soft nitrogen-fed growth is exactly what gall wasps lay eggs into."
    category: feed
    completed: 2026-07
  - months:
      - 12
    task: "Summer feed (5 min): Experts Choice fruit & citrus, LIGHT dose, half what the bag says, scattered at the dripline and watered in. The tree was hard-pruned in Aug 2026 and will flush hard anyway; feeding it up just makes gall wasp bait."
    category: feed
  - months:
      - 3
    task: "Autumn feed (5 min): Experts Choice fruit & citrus, LIGHT dose at the dripline, watered in. Last feed before winter. Skip it if the tree is still pushing pale soft shoots from the summer feed: that is the gall wasp target, not a hungry tree."
    category: feed
  - months:
      - 8
      - 9
      - 10
    task: Taste-test a grapefruit every few weeks — yellow ≠ ripe, they sweeten with hang time and hold on the tree for months
    category: harvest
  - months:
      - 9
    task: "Light shape prune (15 min, secateurs): only crossing or inward-growing branches and anything touching the ground, each cut back to a fork. Never more than a fifth of the canopy. Hard cuts bring the soft flush gall wasps want."
    category: prune
    completed: 2026-08
  - months:
      - 11
    task: "Sunburn paint (20 min): 50/50 white acrylic paint and water brushed on the top side of limbs that were shaded until the Aug 2026 hard prune and now sit in full sun. Bark going pale or splitting on the sunny side = sunburn starting. Skip limbs the regrowth already shades."
    category: general
  - months:
      - 10
    task: "Sunshade clearance prune (20 min, secateurs, loppers for anything thicker than a thumb): the tree is wrapping around the retractable sunshade. Take out every vertical watershoot that reaches the shade right back to where it leaves the limb, flush, no stub: those straight soft shoots are regrowth from the August hard prune and they come back if you only shorten them. Anything else touching the shade, cut 40cm below the line the shade sits on when extended, back to a bud or side branch, so a month of growth does not re-wrap it. Stop there. No cutting into the thick old wood and no more than that off the tree this year: it already lost half its canopy in August."
    category: prune
    completed: 2026-10
  - months:
      - 12
      - 2
    task: "Sunshade clearance check (5 min): any shoot within 20cm of the extended sunshade, cut it 40cm below the shade line to a bud, watershoots out at the limb. Clear = done."
    category: prune
  - months:
      - 7
      - 8
    task: "Gall wasp check (5 min, no spraying, must be done before September): run hands along the young stems feeling for sausage-shaped swellings. Found one? Cut 5cm below it with secateurs and bin it, not compost, before month's end: the adults emerge from galls in Oct-Nov and lay into the spring flush. Nothing found = done"
    category: prune
    completed: 2026-10
  - months:
      - 10
    task: "Sugarcane top-up (10 min): 5cm from the bale over the whole root zone out to the canopy edge, a hand's width clear of the trunk. Citrus roots sit in the top 30cm and cook in a Melbourne summer without it"
    category: mulch
  - months:
      - 4
    task: "Sugarcane top-up (10 min): the summer layer has broken down to nothing by now. 5cm from the bale over the root zone, clear of the trunk, before the winter rain"
    category: mulch
  - months:
      - 1
      - 2
    task: "Leaf miner glance on the summer flush (2 min): silvery squiggly tunnels in the newest soft leaves = eco-oil both sides of the new growth on a cool evening under 25°, repeat in a week. Old leaves with tunnels are history, ignore them"
    category: spray
  - months:
      - 10
      - 3
    task: "Magnesium check (5 min): older leaves yellow between green veins (the inverted-V pattern) = 2 tablespoons Epsom salts in a 9L can, poured over the root zone. Even green = skip it. This tree has the Mg history, so look"
    category: feed
urgency: week
dueBy: "2026-10-29"
nextAction: "Pale leaf check (30 sec): only the new soft tip growth pale, old leaves behind it dark = normal spring flush, do nothing. Old leaves pale too: yellow between the veins with a green arrow at the base = Epsom salts, 2 tablespoons in a 9L can over the root zone, once. Old leaves fading evenly, lowest first = nitrogen, bring the December feed forward: Experts Choice at HALF the bag rate at the dripline, watered in (half because gall wasps are laying now and lush flush is what they target)."
