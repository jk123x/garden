name: Grapefruit Tree
type: fruit
location: Backyard
zones:
  - 4
health: Pale leaves reported 22 Oct 2026, about 11 weeks after the Aug hard prune and 3 months after a light July feed. Heat isn't the cause (heat wilts, it doesn't bleach). Most likely normal pale spring flush plus the tree's known magnesium story; check which leaves are pale before treating.
healthStatus: good
lastAssessed: 2026-10
image: /images/winter-2026/IMG_2291.jpg
