nextAction: "SESSION 2 — feed blitz, one lap of the garden (~1hr, once the Bunnings order lands): (1) Richgro All Purpose (owned) on the perennial beds, jasmine runs, muehlenbeckias, olive, passionfruit, strawberry, frangipani. (2) Sudden Impact (owned) on the buffalo. (3) Light Experts Choice (owned) on lemon, orange and small citrus — NOT the lime. (4) Osmocote Native (ordered) on banksia, wattle, kangaroo paw, westringia, cushion bush, chalk sticks, dianellas, native daisies — natives get ONLY this one. (5) Skip the cutting-bed echinacea entirely (rot risk). (6) Snail bait in the copper tub and cutting bed while the bag's open. Replaces the September feed round."
image: /images/plants/cutting-bed.jpg
notes: "Salvia leucantha (Mexican Bush Sage). Multiple plants producing masses of purple velvet flower spikes — easily the best performer in the garden right now. Growth is sprawling, reaching over the stone path area. Cut back hard (by half to two-thirds) after flowering finishes, usually around May-June. Practical trigger: cut when the bees abandon the spikes — that's the reliable signal flowering's spent, better than going by the calendar. Regrows fast from the base in spring. The spent flower spikes turn brown and should be removed."
