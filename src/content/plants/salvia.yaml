notes: "Salvia leucantha (Mexican Bush Sage). Multiple plants producing masses of purple velvet flower spikes — easily the best performer in the garden right now. Growth is sprawling, reaching over the stone path area. Cut back hard (by half to two-thirds) after flowering finishes, usually around May-June. Practical trigger: cut when the bees abandon the spikes — that's the reliable signal flowering's spent, better than going by the calendar. Regrows fast from the base in spring. The spent flower spikes turn brown and should be removed."
