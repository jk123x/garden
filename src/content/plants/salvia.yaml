    task: "Deadhead (5 min): snip any spike that has gone brown and dry back to the leaf pair below it. Keeps the purple spikes coming through summer. While there, trim any stem sprawling across the stone path back to the bed edge."
    category: general
    repeat: monthly
    completed: 2026-10
