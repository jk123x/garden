    entry: "Monthly Oct-Mar deadhead row deleted (Jay: why monthly?). Mexican sage flowers late summer to autumn on new growth and doesn't re-flush from deadheading, so the row was noise. Replaced with one November tip pinch and an optional April tidy."
    category: general
