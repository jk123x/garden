health: "Spring regrowth strong (11 Sept 2026 photo IMG_3571): a ring of fresh grey-green shoots from the base and from the old stubs, exactly the normal post-cutback pattern. The dead-looking centre is last season's cut stems; new growth comes from the rhizomes around them. Jay mounded potting mix with a little dolomite over the centre on 10-11 Sept thinking it was the lavender. Harmless: the sage roots along buried stems anyway."
