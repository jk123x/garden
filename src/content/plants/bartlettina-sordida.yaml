name: Bartlettina sordida
type: shrub
location: Backyard (around frangipani)
zones:
  - 2
health: In full flower mid-October 2026, gorgeous (Jay). Big volume expansion through winter; slumping under its own soft top-heavy growth (normal for bartlettina, the post-flowering cutback resets it).
healthStatus: healthy
lastAssessed: 2026-10
image: /images/winter-2026/IMG_2295.jpg
photos:
  - src: /images/winter-2026/IMG_2295.jpg
