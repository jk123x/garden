notes: Purple Torch / Mexican Bush Daisy (Bartlettina sordida). Semi-tropical with large soft velvety leaves. Growing around the frangipani base along the back fence. The dead brown material at the base of the plant needs cleaning out — old leaves and spent flower stalks. Watch the dark spots on leaves — could be fungal if it spreads, but likely just weathering from summer heat. Cut back hard in spring if it gets too scruffy.
tasks:
  - months:
      - 11
    task: "Prune to shape once the purple puffs have browned off (1 hour, secateurs): it's in full flower mid-October, so this waits for the show to finish, usually early November. Take the whole bush back by a third to a half, cutting each soft stem just above a pair of leaves or an outward bud. It's soft wood, so it cuts easily and reshoots fast. Puffs still purple = leave it another week"
    category: prune
    byDay: 15
  - months:
      - 9
    task: "Feed (2 min): Richgro All Purpose at the bag rate scattered around the base out to the drip line, then water in. Feed AFTER the spring cutback, not before it, or you feed growth you are about to remove"
    category: feed
    completed: 2026-07
  - months:
      - 6
      - 7
    task: "Frost check (1 min): the trigger is a forecast under 2 degrees on the dashboard weather strip. That night, throw an old sheet over the top and pull it off in the morning. Blackened soft tips after a frost are cosmetic, cut them off in spring, not now"
    category: general
    completed: 2026-07
log:
  - date: "2026-10-16"
    entry: Full purple flower, looking gorgeous. Jay holding the cutback until the show is over; prune row moved from 15 Oct to November with a 'puffs browned off' trigger.
    category: general
  - date: "2026-08-19"
    entry: Multiguard ring refreshed (the 10 Aug 29mm dissolved the 31 Jul bait). Buds still on track for the lilac show.
    category: general
  - date: "2026-08-06"
    entry: End-of-winter baseline photos (IMG_2295). Flower buds well developed — the lilac fluff show is close. Leaves look less chewed than late July; Multiguard ring seems to be holding. Leave it be until after flowering.
    category: general
  - date: "2026-07-31"
    entry: Multiguard ring laid around the base for the leaf-hole culprit. Refresh after heavy rain if holes keep appearing; if they do and there's no slime trail, check undersides for caterpillars.
    category: general
  - date: "2026-07-30"
    entry: "Holes in leaves spotted — probable slugs/snails on the soft winter growth; Multiguard bait to go down (caterpillar check on leaf undersides while at it). Plant otherwise booming: big winter volume expansion, flower buds coming, stems slumping/leaning under the top-heavy soft growth — posture issue only, normal for the species, September cutback will reset it. Loose stake-tie any stem gone fully horizontal; don't cut flowering tops."
    category: general
  - date: "2026-07-29"
    entry: Fed with Richgro All Purpose (pre-baby feed blitz) — replaces the September feed.
    category: feed
