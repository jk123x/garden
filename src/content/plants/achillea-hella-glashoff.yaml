name: Achillea 'Hella Glashoff'
type: perennial
location: Backyard (new composted bed + original bed)
zones: [2, 3]
health: "Settled in after the April 16 division/transplant. Three weeks on, all clumps are fine — no wilting, foliage holding. Established."
healthStatus: healthy
lastAssessed: "2026-08"
image: /images/plants/IMG_1018.jpg
photos:
