name: Parlor Palm (Bathroom)
type: palm
indoor: true
location: Bathroom
health: "Healthy"
healthStatus: healthy
lastAssessed: "2026-04"
image: /images/plants/IMG_0927.jpg
notes: "Chamaedorea elegans. Bright green, full — benefits from the bathroom humidity."
log:
  - date: "2026-08-18"
    entry: "One of the two parlor palms (Jay forgets which) showed small white fern-scale flecks and got an alcohol spray round 1 — the sprayed one will be identifiable by the flecks/treatment residue. Whichever palm it is: cloth-wipe rounds 2-3 at 7-10 day intervals alongside the library rabbit's foot. Check stems and frond undersides."
    category: spray
tasks:
  - months: [9, 10, 11, 12, 1, 2]
    task: "Feed: PowerFeed at half strength, about 1ml per litre, poured onto already-moist soil on a normal watering day. Never onto dry soil. Fishy for a day, so do it in the laundry or outside"
    category: feed
  - months: [4, 5, 6, 7, 8]
    task: Reduce watering — check top 2cm before watering
    category: water
  - months: [9]
    task: Trim any brown/yellow fronds
    category: prune
  - months: [4, 5]
    task: Wipe fronds with damp cloth to remove dust
    category: general
  - months: [4, 5, 6]
    task: Check soil for fungus gnat larvae; yellow sticky trap if needed
    category: spray
