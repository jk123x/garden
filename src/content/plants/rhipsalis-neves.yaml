name: Rhipsalis Neves-Armondii
type: succulent
indoor: true
location: Study (windowsill)
health: "Thriving — full lush cascade. Aug 2026 photo: stems plump, deep even green, well hydrated. Heavy aerial-root production along the stems — normal epiphyte behaviour, possibly hinting at dry air; harmless."
healthStatus: healthy
lastAssessed: "2026-08"
image: /images/plants/rhipsalis-study-aug-2026.jpg
photos:
  - src: /images/plants/rhipsalis-study-aug-2026.jpg
    caption: "On the study windowsill — plump green stems, aerial roots everywhere (23 Aug 2026)"
  - src: /images/plants/IMG_0964.jpg
