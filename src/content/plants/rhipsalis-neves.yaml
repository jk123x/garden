notes: "Epiphytic cactus. Dense trailing pencil-thin stems, white swirl pot. Location corrected Aug 2026: study windowsill (was filed as library — good news given the library pest cluster). The pale wiry threads along stems are aerial roots — normal for the species, NOT spider mite webbing (webbing = silk sheets spanning between stems + stippled foliage); snip for looks or leave. Brown papery stem tips = old growth points, cosmetic. Watering: dries between drinks. Top cm dry in summer, every 3-4 weeks in winter."
