notes: "Epiphytic cactus. Dense trailing pencil-thin stems, white swirl pot. Location corrected Aug 2026: study windowsill (was filed as library — good news given the library pest cluster). The pale wiry threads along stems are aerial roots — normal for the species, NOT spider mite webbing (webbing = silk sheets spanning between stems + stippled foliage); snip for looks or leave. Brown papery stem tips = old growth points, cosmetic."
log:
  - date: "2026-08-23"
    entry: "Photo check (Jay asked about the pale threads): aerial roots, normal — explicitly NOT spider mite webbing. Stems plump and deep green, plant thriving. Location corrected library → study windowsill, which also removes it from the library pest-cluster worry list. Heavy aerial roots can hint at dry air — optional occasional mist, no action required."
    category: general
tasks:
  - months: [9, 10, 11, 12, 1, 2]
    task: "Feed: PowerFeed at half strength, about 1ml per litre, poured onto already-moist soil on a normal watering day. Never onto dry soil. Fishy for a day, so do it in the laundry or outside"
    category: feed
  - months: [4, 5, 6, 7, 8]
    task: Reduce watering — let dry out between drinks
    category: water
  - months: [12, 1, 2]
    task: Water when top cm of soil is dry
    category: water
  - months: [4, 5, 6]
    task: Check soil for fungus gnat larvae; yellow sticky trap if needed
    category: spray
