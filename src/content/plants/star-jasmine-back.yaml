health: "11 Nov 2026: the mature section behind the table is a solid wall in full flower under the passionfruit cap (IMG_4346, IMG_4353). The studio run past the raised beds is a thin one-leader espalier, flowering along every wire, with the wires above the fence line mostly bare (IMG_4363-4365). That is the expected look after the one-leader thinning; the fill comes December to February."
healthStatus: healthy
