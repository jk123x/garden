notes: "Trachelospermum jasminoides. The back (north) fence is the most established section — proper wall-of-green coverage. The density is great but means the interior will accumulate dead leaves over time. After flowering in summer, prune to keep it off the gutters/roof and clear any dead material. Well-established jasmine like this is low-maintenance beyond seasonal shaping."
tasks:
  - months: [1, 2]
    task: "After-flowering prune (30 min, secateurs): once the last flowers drop, cut back anything reaching onto the gutter or roof and any runner crossing into the garden path. Take the long whippy tails back to the fence line. Pull dead brown leaves out of the interior by hand. Do not cut into the old wood on the fence face: that is the coverage."
    category: prune
  - months: [9]
    task: "Feed (5 min): Richgro All Purpose, normal dose, scattered along the full fence length at the dripline and watered in. Go the last calm weekend before spring: earlier and winter rain leaches it past sleeping roots."
    category: feed
    completed: "2026-07"
  - months: [12]
    task: "Growth-push top-up: second slow-release dose (Richgro) — the July feed is spent by now and the vine is mid-sprint"
    category: feed
  - months: [3]
    task: "Autumn feed (5 min): Richgro All Purpose, normal dose, along the fence base and watered in. Carries the vine through the last warm flush before winter. Skip it if the December top-up went down late, after mid-January."
    category: feed
  - months: [10]
    day: 1
    task: "THE timing-critical session (15 min): go the week the new runners hit 30-60cm and still bend easily — hot spring could mean NOW, typical is mid-Oct. Flush on, runners supple — pinch tips near the lower-fence gaps and the woody corner stretch (IMG_2287) to force laterals there, tie what's already reaching. The top is won; the low gaps are the season goal. Cool spring? Wait until runners hit 30cm"
    category: general
  - months: [11, 12, 1]
    task: "Cohort ties (10 min): lead the newest laterals into the remaining low gaps while supple"
    category: general
