name: Star Jasmine (Back fence)
type: climber
location: Back (north) fence
zones: [4]
health: "Mulched April 2026 (sugarcane, extended from passionfruit mulching). Thick, dense coverage — fence is completely hidden. Glossy dark green leaves in good condition. Some dried debris and yellow leaves from normal cycling. Fully established and vigorous."
healthStatus: healthy
lastAssessed: "2026-08"
log:
  - date: "2026-10-07"
    entry: "Pinch rule settled with Jay: runners into bare fence run unpinched (horizontal tie-in does the branching); pinch only over covered fence and above the top wire. Written into the cohort ties rows."
    category: general
  - date: "2026-09-16"
    entry: "Jay: the jasmine is really starting to grow again after a run of 20°+ days. Spring flush is on, about a fortnight ahead of a typical year. The 1 Oct timing-critical session stays on its date, but the trigger is length not date: the week the longest new runners hit 30-60cm and still bend easily is the week to go, even if that lands late Sept."
    category: general
  - date: "2026-08-06"
    entry: "End-of-winter baseline photos (IMG_2283-2288 — the run along the studio, plus the dense corner by the raised beds). Espaliered laterals sitting neatly on the mesh with the fresh figure-8 ties from the tie audit visible throughout. Coverage: dense and mature at the corner end, mid-run filling, some lower-fence gaps that spring growth + sideways training will close. Looks well set up."
    category: general
  - date: "2026-08-05"
    entry: "Tie audit COMPLETE across all three jasmine sections — every unnecessary tie removed, nothing left biting bark. Girdling risk for the spring thickening season cleared. Spring/summer training ties get the loose figure-8 treatment from here."
    category: general
  - date: "2026-07-29"
    entry: "Tie audit now ~50% done — steady progress in chunks since 21 July."
    category: general
  - date: "2026-07-29"
