notes: "Trachelospermum jasminoides. The back (north) fence is the most established section — proper wall-of-green coverage. The density is great but means the interior will accumulate dead leaves over time. After flowering in summer, prune to keep it off the gutters/roof and clear any dead material. Well-established jasmine like this is low-maintenance beyond seasonal shaping. Framework rule (Jay, 16 Oct 2026): ONE leader per wire per direction. A second runner twining the same wire gets, in order: rerouted to a bare wire or gap, or snipped to 2-3 leaves as a fill-in lateral, or cut out at the base only where that stretch is already covered. Never cut the short perpendicular side shoots off a tied leader (that's the fill) or the old brown framework."
tasks:
  - months:
      - 1
      - 2
    task: "After-flowering prune (secateurs): once the last flowers drop, cut back anything reaching onto the gutter or roof and any runner crossing into the garden path. Take the long whippy tails back to the fence line. Pull dead brown leaves out of the interior by hand. This is also the one time to thin the unruly sections to a skeleton: where the face is a tangle, keep one stem per grate and cut the surplus woody stems at the base, never shortened. Thin, never strip: a grate with nothing left on it is a hole for a year. The low gaps and the woody corner keep everything."
    category: prune
  - months:
      - 9
    task: "Feed: Richgro All Purpose, normal dose, scattered along the full fence length at the dripline and watered in. Go the last calm weekend before spring: earlier and winter rain leaches it past sleeping roots."
    category: feed
    completed: 2026-07
  - months:
      - 12
    task: "Growth-push top-up: second slow-release dose (Richgro) — the July feed is spent by now and the vine is mid-sprint"
    category: feed
  - months:
      - 3
    task: "Autumn feed: Richgro All Purpose, normal dose, along the fence base and watered in. Carries the vine through the last warm flush before winter. Skip it if the December top-up went down late, after mid-January."
    category: feed
  - months:
      - 10
    day: 1
    task: "THE timing-critical session: go the week the new runners hit 30-60cm and still bend easily — hot spring could mean NOW, typical is mid-Oct. Flush on, runners supple — pinch tips near the lower-fence gaps and the woody corner stretch (IMG_2287) to force laterals there, tie what's already reaching. The top is won; the low gaps are the season goal. Cool spring? Wait until runners hit 30cm. Old-wood rule: brown stiff stems carry the Christmas flowers, so a healthy one with plenty of leaves and bud clusters stays even if it is not where you would design it. The exception is the clear-cut swap: a tired woody stem barely growing along a grate right next to vigorous new shoots that come from a DIFFERENT stem or the base = cut the old one at its base now. Trace each new shoot back first: if it springs off the old branch, cutting the old branch kills it, so cut the old branch back to just past the last good new shoot instead. Stem by stem, never a clearance, no more than a third of the old wood on any covered section this spring."
    category: general
    completed: 2026-10
  - months:
      - 11
      - 12
      - 1
      - 2
      - 3
    task: "Cohort ties: one leader per wire per direction, Highlander rule. Untwine any new runner competing on an already-led wire and reroute it to bare wire or a gap; no gap in reach = snip it to 2-3 leaves as a fill lateral. lead the newest laterals into the remaining low gaps while supple Pinch rule: a runner heading into bare fence is NOT pinched, lead it horizontally and let it run until it reaches the far edge of the gap, then pinch so it fills back. Pinch only shoots over already-covered fence and anything racing above the top wire."
    category: general
    repeat: monthly
