notes: "Aspidistra elatior. Was cut back hard and is re-emerging from the rhizome. Pot is way too big for current root mass — huge overwatering risk. Keep dry and consider repotting into a much smaller pot in spring. Watering: the pot is oversized for the roots, so bone dry between drinks. Top 5cm dry, monthly in winter."
tasks:
