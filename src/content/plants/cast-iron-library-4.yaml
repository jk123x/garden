    task: "Repot into a snug pot (20 min): the pot is far too big for the roots, which is why it stays wet. Knock it out, shake off the sodden mix, and pot into a container only 2-3cm wider than the root mass in free-draining mix. Water once, then leave it a fortnight"
    category: general
