notes: Asplenium australasicum. Big outdoor specimen in the front yard. The close-up photo confirms brown frond edges — this is most likely wind damage or summer sun scorch. The centre of the rosette has accumulated dead frond bases and leaf litter that should be cleaned out to prevent rot. Remove the worst-damaged fronds at the base. If the browning keeps getting worse, the fern may need more afternoon shade — either from nearby plants or a temporary shade cloth over summer. Keep the soil consistently moist but not waterlogged.
tasks:
  - months:
      - 11
    task: "Water, then feed the bird's nest ferns (watering can): 1) If the soil at the base is dry a finger deep, pour a full can of plain water round each rosette first. 2) Then PowerFeed at 1ml/L, half a can on the soil round each, none into the cup of the nest. Skip step 1 the morning after rain or a sprinkler run. On the first 30° days look at the middle of the fronds: crisp brown patches = sunburn, tell Claude. Don't use granules; because granules lodge in the nest and rot the crown"
    category: feed
    completed: "2026-11"
  - months:
      - 9
      - 12
    task: "Feed both rosettes: any indoor-plant liquid feed at HALF the label dose (ferns burn on full strength), watered onto the soil around the base. No liquid feed in the house? A small pinch of Richgro All Purpose scattered at the dripline and watered in does the same job. Never pour anything into the rosette centre, the funnel holds liquid and rots. Dry soil? Water first, then feed"
    category: feed
    completed: 2026-09
  - months:
      - 9
    task: "Frond tidy: cut fully brown or badly torn outer fronds off at the base with scissors, and scoop dead frond bases and leaf litter out of the rosette centre so it cannot rot. Leave green fronds with only brown edges, they still feed the plant"
    category: prune
    completed: 2026-09
  - months:
      - 4
    task: "Mulch: top up around the base to about 5cm, keeping mulch out of the rosette centre and off the crown. Mulch in the funnel holds water against the growing point and rots it"
    category: mulch
    completed: 2026-04
  - months:
      - 12
      - 1
      - 2
    task: "Heat check: on any forecast 35+ day, water the root zone the evening before and drape shade cloth or an old sheet over it for the afternoon. Crisp brown frond margins after a hot day mean it needed this. Drip covers normal summer days"
    category: water
    heat: 35
