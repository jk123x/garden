name: Birds Nest Fern
type: fern
location: Front yard
health: "Centre of rosette cleared and worst brown fronds removed April 2026. Good colour and size. Brown frond margins (wind/sun damage) still visible on some fronds. Possibly needs more shelter if browning continues."
