  - date: "2026-08-06"
    entry: "End-of-winter baseline photos (IMG_2265/2275). Both deck-side rosettes big and vigorous with fresh lime-green fronds — wintered well. Minor snail/slug chew holes on some fronds; cosmetic. If it spreads, a light ring of Multiguard (the cat-safe iron one already in the shed) sorts it — no oils on ferns, ever."
