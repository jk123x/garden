notes: Rosmarinus officinalis. Big established bush along the back fence near the star jasmine. Dense, upright, and full with no bare patches or dieback. Thrives on the full sun and free-draining position. Basically bulletproof in Melbourne. Prune for shape and harvest after flowering in spring.
tasks:
  - months:
      - 2
      - 3
    task: "Shape prune (10 min, scissors): after flowering, snip the green tips back by a third to thicken the ends. Only cut where green leaves remain below the cut. Bare grey wood does not reshoot, so a cut into it is permanent."
    category: prune
  - months:
      - 9
    task: "Light feed: PowerFeed at half strength, about 1ml per litre, one 9L can poured round the dripline, not the trunk. Lean-soil plant recovering from dieback, so half is the ceiling and once is enough"
    category: feed
    completed: 2026-09
