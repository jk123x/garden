name: Rosemary
type: herb
location: Backyard
zones:
  - 4
health: Dead half removed 22 July 2026 (photo verified — clean work). What remains is a leaning, sculptural old trunk with long woody stems carrying healthy green growth and flowers at the tips. Alive and viable, but permanently leggy — rosemary can't reshoot from the bare wood, so the form now is roughly the form forever. Foliage will thicken at the green tips through spring.
healthStatus: monitor
