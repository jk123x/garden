log:
  - date: "2026-09-10"
    entry: "Fed: one 9L can of half-strength PowerFeed round the dripline. Its only feed for the year."
    category: feed
  - date: "2026-08-06"
    entry: End-of-winter baseline photos (IMG_2294/2302/2303). The kept half is flowering blue and holding good green tip growth — the July call is vindicated, plant clearly viable. Cut stems still piled in/near the tub — green bin them when passing.
    category: general
  - date: "2026-08-04"
    entry: "Pine bark mulched from the Daisy's 1m³ 20mm bark delivery (Jay, 23 Oct 2026: the pile reached every bed bark is appropriate for; this is one of them). Good for 2-3 years, no top-up until bare soil shows."
    category: mulch
  - date: "2026-07-22"
    entry: "Dead half cut out at the base. Remaining live section: leaning woody trunk, green flowering growth at stem tips. Verdict: correct call, plant viable. Long-term options: embrace the windswept look and tip-pinch new growth in spring to thicken the ends, or plant a young replacement nearby and let this one see out its years. Take cuttings from green sprigs as succession insurance. No watering — drainage stress was the likely cause of the collapse."
    category: prune
  - date: "2026-07-21"
    entry: "Photo assessment: ~half the bush dead (grey sprawled bare stems), other half regrowing nicely and flowering. Jay confirmed same from the ground. Plan: remove dead half at base, keep live half, take cuttings as insurance."
    category: general
  - date: "2026-05-18"
    entry: Pruned back (off-season tidy). Bulletproof bush, handled it fine. Doesn't replace the normal after-flowering shape prune in Feb/Mar.
    category: prune
