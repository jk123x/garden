name: Olive Tree
type: tree
location: Backyard
health: "Healthy — mature tree with full silvery-green canopy. Good branch structure, no dieback visible. Some internal crossing branches could be thinned for airflow."
healthStatus: healthy
lastAssessed: "2026-04"
urgency: week
nextAction: "Winter prune, DIY with these rules: (1) Dead, damaged, crossing/rubbing branches first — always cut. (2) Then remove a few inward-growing branches so light reaches the centre; aim for 'a bird could fly through it'. (3) Cut just outside the branch collar (the swollen ring at the base), never flush. (4) Remove any suckers from the base/trunk. (5) Stop at ~20% of the canopy total. Step back after every few cuts and look. Don't shorten branch tips — take whole branches at their origin or leave them."
notes: "Olea europaea. Well-established tree near the back fence. Dense canopy with characteristic silvery-green foliage. Could benefit from light structural thinning of internal branches to improve airflow and reduce pest habitat, but not urgent. Drought-tolerant and low-maintenance — one of the easiest plants in the garden."
image: /images/plants/IMG_0912.jpg
tasks:
  - months: [7, 8]
    task: Prune to shape — open up centre for airflow
    category: prune
  - months: [9]
    task: Feed with complete fertiliser
    category: feed
  - months: [3]
    task: Feed again in autumn
    category: feed
