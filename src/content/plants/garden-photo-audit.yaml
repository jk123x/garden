log:
  - date: "2026-11-11"
    entry: "Spring round row marked done at Jay's request (35 photos sent 11 Nov). Off the to-do list until the March autumn round. Areas not shot this round get picked up then."
    category: general
  - date: "2026-11-11"
    entry: "Spring photo round, part 1: 35 photos (IMG_4343-4377) stored in /images/spring-2026/ and compared with the winter baseline. Covered: back bed, lawn, both back jasmine sections, east run and its three young plants, passionfruit, grapefruit and the citrus by the studio, frangipani, lily turf, blue star fern, raised beds and tubs, taro, and the front deck-side bed, gymea, paws and feijoa. Jobs raised: hose guides (dusty miller card), suspect asparagus fern under the gymea, grapefruit trunk shoots, climbing leaders on the young jasmines, bird's nest feed, hoop shuffle on the lawn. Every other photo has a 'nothing needed, because' line on its card. Not shot yet: banksia, wattle, west jasmine run, olive, the three fence muehlenbeckias, nature strip, lavender, cushion bush, dianellas, lemon close-up."
    category: general
  - date: "2026-09-08"
    entry: "Miss found: the Aug round photographed the front westringia domes at double their April size and I logged 'nothing needed'. New review rule written into the notes: every photo yields a job or a stated reason for none. Same day: outdoor task-quality pass started, rewriting bare-label calendar rows into glance-ready how-tos."
    category: general
  - date: "2026-09-05"
    entry: "Jay asked for photo-round prompts on a fixed rhythm: end of winter (Aug), late spring (Nov/Dec) and autumn (Mar). Card renamed to Garden Photo Rounds and the three rounds added as tasks so they surface on the dashboard at the right time."
    category: general
  - date: "2026-08-07"
    entry: "AUDIT CLOSED. Final IDs settled in a live session with Jay: the front-gate 'other blue thing' = Cotyledon 'Silver Waves' (designer-confirmed, new 45th entry), all chalk sticks = Dwarf Blue (designer-confirmed), Blue Star Fern confirmed (research + Jay), IMG_2290 tub-side clumps = two lily turfs the shear missed (leave alone), IMG_2332/2333 feathery sprigs = trample debris from the work sessions, not a plant. /photo-audit page trimmed to a plain baseline gallery. No questions remain."
    category: general
  - date: "2026-08-07"
    entry: "Asparagus fern RIPPED OUT by Jay (photos IMG_2332/2333) — the audit's flagged weed is gone; watch the spot for tuber regrowth in spring. Same session: the front chalk sticks patch got roughed up (recovers fine, loose bits re-rootable). The 'other blue thing' question resolved by Jay: it's all just dwarf blue chalk sticks, misshapen and beaten up — no new plant."
    category: general
  - date: "2026-08-06"
    entry: "ID review session with Jay, same day — most questions answered live: 2277 = dianellas (no missed paw haircut), 2274 = miscanthus reshooting, 2288's tree = native frangipani, 2291/2292 = grapefruit (not orange), 2289/2293 = the flower beds (achillea/echinacea), 2305's 'bare tree' = jasmine's bare lower framework, 2306 = dusty miller + lavender (both already catalogued), 2308/2309/2311 = east side outside the laundry (passionfruit runner has reached the far side of the shed), 2272 big dome = westringia, wattle = 'Scarlet Blaze' CONFIRMED. Weeding round 2 put on the dashboard at Jay's request (kikuyu in east bed, flower-bed rosettes, taro seedlings). Remaining: jasmine run mapping for 2280-2287, base test on the tub-side clumps, bartlettina confirm."
    category: general
  - date: "2026-08-06"
