notes: "Tracking entry, not a plant. REVIEW RULE (8 Sept 2026, after the westringia slipped through the Aug round): every photo in a round must produce either a dated job on the plant card or an explicit 'nothing needed, because...' in the log. A plant that has outgrown its spot, gone leggy or changed shape counts as a job, not a healthy note. The winter 2026 works (feijoa renovation, paw haircut, olive prune, passionfruit reshape, feed blitz) reset half the garden — this photo set is the 'before' baseline. AUDIT CLOSED 7 Aug 2026: every ID settled, no open questions. The only follow-up is the spring comparison shoot (task below)."
