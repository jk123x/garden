name: Japanese Holly Fern (Black Pot)
type: fern
indoor: true
location: Library (isolated)
health: "Fern scale (Pinnaspis aspidistrae) confirmed July 2026 — the white material was never sori. All three treatment rounds complete (29 Jul cut + spray, 8 Aug wipe, 18 Aug wipe). Now in the weekly-inspection phase: fresh white flecks on the midribs = bin the plant."
healthStatus: monitor
lastAssessed: 2026-08
urgency: later
nextAction: "Weekly library fleck glance (1 min): both holly ferns' midribs, the rabbit's foot fern's fronds and feet, the flecked parlor palm, and the cascade palm's frond undersides. Fresh white flecks on a fern = the wipes lost, bin it — two ferns aren't worth the collection. Everything clean through mid-Sept = won, end isolation and resume normal care + feeding."
image: /images/plants/IMG_0971.jpg
notes: "Cyrtomium falcatum. DIAGNOSIS HISTORY: April 2026 flagged white powdery material, treated with alcohol + soap, then re-read as probable sori and downgraded to monitor. July 2026 photos overturned that — the white felted 1-2mm flecks and cottony ribbons run along the TOP of the rachis and scatter across leaflet upper surfaces, which sori never do (sori are firm round dots in rows on the underside only). This matches male fern scale armor exactly: white, felted, conspicuous against dark foliage, clustering along midribs, with tan oyster-shell females hidden in the mass. Fern scale is one of the most common pests of exactly this species. Armored scale, so no honeydew — the April 'honeydew' was a misread. It has been active since at least April; the wipe-downs knocked it back but never cleared the crawlers. Watering: evenly moist Oct-Mar, top 2cm dry between drinks Apr-Sept. Never oils on this fern."
tasks:
  - months:
      - 9
    task: "Frond tidy (5 min, scissors): cut fully brown or badly torn fronds off at the base, and look along the midribs for white flecks while you're in there (fern scale history in this room). Flecks = alcohol wipe on sight"
    category: prune
