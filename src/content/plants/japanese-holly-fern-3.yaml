    category: spray
log:
  - date: "2026-07-29"
    entry: "Collection inspection done: white scale clearly present on 2 holly ferns only (this one + one other — pot TBC). Library bird's nest, rabbit's foots and the rest look clear. Both affected ferns get the wipe rounds together; round 1 alcohol spray covered them."
    category: general
  - date: "2026-07-29"
    entry: "Jay reports the big indoor bird's nest fern (study) went gradually lifeless and was binned earlier in July — retrospectively a possible fern scale casualty (bird's nest ferns are prime hosts). Notably its decline was diagnosed in May as dryness/low humidity and never responded to daily misting — consistent with scale being the real cause. If so, the infestation has been circulating indoors for months. Raises the priority of inspecting all remaining indoor ferns. YAML for the binned fern deleted; outdoor bird's nest is fine."
    category: general
  - date: "2026-07-29"
    entry: "Treatment round 1 done same day as diagnosis: worst-affected fronds cut off, remaining fronds sprayed liberally with isopropyl alcohol (neighbouring plants sprayed too). Round 2 due 5-8 Aug as a cloth wipe, round 3 a week after that. Watch for alcohol burn on fronds from the heavy spray."
    category: spray
  - date: "2026-07-29"
    entry: "Fresh photos re-examined with research: fern scale (Pinnaspis aspidistrae) confirmed, overturning the April 'probably sori' verdict. White felted male scales in heavy colonies along the tops of the rachises and scattered over leaflet surfaces — wrong side and wrong texture for sori. Plan: re-isolate, cut worst fronds, soapy wipe-downs every 7-10 days, no oils on ferns, bin if it persists. Neighbouring ferns need a check."
    category: general
