name: Japanese Holly Fern (Black Pot)
type: fern
indoor: true
location: Library (isolated)
health: "Monitor — white crumbly material most likely sori (reproductive structures), not mealybug. Reassessed after closer inspection."
healthStatus: monitor
lastAssessed: "2026-04"
image: /images/plants/IMG_0971.jpg
notes: "Cyrtomium falcatum. Original April assessment flagged mealybug based on white powdery material + honeydew. After alcohol + soapy wipe-down treatment, closer inspection found no visible bugs and the remaining white crumbly material is most likely sori (fern reproductive structures on frond undersides). No spread to neighbouring plants, which supports the sori theory. Honeydew from original assessment was either a light infestation that the first treatment killed, or a misread (water spots, condensation). Currently isolated as a precaution. Plan: monitor for 2-3 weeks, press-test leaves for stickiness, inspect weekly for any new white fluff on stems/crown (not frond undersides where sori live). If nothing appears, return to normal Library shelf and treat as healthy."
tasks:
  - months: [4, 5]
    task: "Weekly inspection — check stems, crown, and axils for new white fluff or stickiness (ignore round dot-clusters on frond undersides, those are sori)"
    category: general
  - months: [4, 5]
    task: "Press-test a few leaves each week — any stickiness means active pest, treat immediately with alcohol + soap"
    category: general
  - months: [4]
    task: "Rinse fronds with plain tepid water to remove any remaining soap residue from the earlier treatment"
    category: general
  - months: [5]
    task: "If no signs of pest after 2-3 weeks isolation, return to Library shelf and resume normal care"
    category: general
  - months: [9, 10, 11, 12, 1, 2]
    task: Feed with half-strength liquid fertiliser monthly
    category: feed
  - months: [9]
    task: Remove old/tatty fronds
    category: prune
  - months: [12, 1, 2]
    task: Keep soil consistently moist in summer
    category: water
  - months: [4, 5]
    task: Reduce watering — check soil 2cm down before watering
    category: water
  - months: [4, 5, 6, 7, 8]
    task: Group with other plants or sit on pebble tray for humidity (only once confirmed pest-free)
    category: general
  - months: [4, 5, 6]
    task: Check soil for fungus gnat larvae; yellow sticky trap if needed
    category: spray
