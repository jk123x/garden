name: Japanese Holly Fern (Black Pot)
type: fern
indoor: true
location: Library (isolated)
health: "Fern scale (Pinnaspis aspidistrae) confirmed July 2026 — the white material was never sori. Heavy colonies along the rachis of multiple fronds. Treatable but persistent; if it's still recurring after two treatment rounds, bin the plant rather than risk the fern collection."
healthStatus: struggling
lastAssessed: "2026-07"
urgency: week
nextAction: "Fern scale round 2 due ~5-8 Aug, on BOTH affected holly ferns (this one + the second one Jay found 29 Jul): WIPE (not spray) every frond top and bottom with a cloth and half-strength alcohol or soapy water, hard along the midribs — the rubbing removes armor a mist can't. Round 3 another 7-10 days later. Crawlers hatch unprotected between rounds; the repeats are what end it. Keep both isolated from other plants throughout. NO eco-oil on ferns. Watch for alcohol burn (browning) after round 1's heavy spray. Still recurring after round 3? Bin them — two ferns aren't worth the collection."
image: /images/plants/IMG_0971.jpg
notes: "Cyrtomium falcatum. DIAGNOSIS HISTORY: April 2026 flagged white powdery material, treated with alcohol + soap, then re-read as probable sori and downgraded to monitor. July 2026 photos overturned that — the white felted 1-2mm flecks and cottony ribbons run along the TOP of the rachis and scatter across leaflet upper surfaces, which sori never do (sori are firm round dots in rows on the underside only). This matches male fern scale armor exactly: white, felted, conspicuous against dark foliage, clustering along midribs, with tan oyster-shell females hidden in the mass. Fern scale is one of the most common pests of exactly this species. Armored scale, so no honeydew — the April 'honeydew' was a misread. It has been active since at least April; the wipe-downs knocked it back but never cleared the crawlers."
tasks:
