notes: Big ornamental grass in the front yard next to the Westringia. Cut back early this year (April) rather than the usual July/August — still fine, it was already fully brown and dormant. Sugarcane mulch down at the base. Will be back to full height by January. Next year's cut-back can go back to late winter if preferred.
tasks:
  - months:
      - 7
      - 8
    task: "Annual cutback (15 min, secateurs or scissors in handfuls): once the clump is fully brown, tie it into a bundle with string, then cut the lot to 10-15cm above ground. Do it before the end of August: cutting after the new green blades are up shears their tips."
    category: prune
    completed: 2026-04
  - months:
      - 9
    task: "Feed (2 min): Richgro All Purpose, normal dose, round the crown once new blades are showing. Feeding before it wakes just leaches."
    category: feed
    completed: 2026-07
  - months:
      - 9
    task: "Divide check as shoots emerge (10 sec): hollow dead ring in the clump centre = divide this spring."
    category: general
    completed: 2026-09
log:
  - date: "2026-08-06"
    entry: "Baseline photo mystery solved: the fine grassy tuft at the deck edge (IMG_2274) is this miscanthus reshooting from the April cutback — Jay ID'd it (I'd flagged it as possible onion grass). Regrowth already moving in early August. Nothing to do; it feeds itself back to full height from here."
    category: general
  - date: "2026-08-04"
    entry: "Pine bark mulched from the Daisy's 1m³ 20mm bark delivery (Jay, 23 Oct 2026: the pile reached every bed bark is appropriate for; this is one of them). Good for 2-3 years, no top-up until bare soil shows."
    category: mulch
  - date: "2026-07-30"
    entry: Fed with Richgro All Purpose (feed blitz round 2) — September feed replaced.
    category: feed
