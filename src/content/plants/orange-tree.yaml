log:
  - date: "2026-10-23"
    entry: "Sunburn paint row deleted: Jay's not doing it. Accept some bark scald on the newly exposed limbs; it's cosmetic on an established tree."
    category: general
  - date: "2026-10-17"
    entry: "Card audit 17 Oct 2026: gall check moved to Jul/Aug, sugarcane refresh Oct + Apr added, leaf miner glance Jan/Feb added."
    category: general
  - date: "2026-10-09"
    entry: "October gall wasp check done: no galls found. Nothing else to do on this tree until the Nov sunburn-paint check."
    category: general
  - date: "2026-09-17"
    entry: "ID settled by Jay 17 Sept 2026: this card is the ORANGE (the other backyard citrus with the lime and grapefruit). Card renamed from 'Citrus Tree (Backyard)'. Stays on zone 4."
    category: general
  - date: "2026-09-08"
    entry: "Ant check: Jay confirms no ants. Scale cycle broken, no third oil round, treatment program closed (same result as the lemon the same day). Next pest item is the annual winter gall check."
    category: spray
  - date: "2026-09-05"
    entry: "Jay confirmed the backyard fruit trees were cut back hard recently (the heavy Aug prune session). September 'light prune to shape' marked done — no further pruning this year; the tree needs its regrowth. Hard-prune caveats stand: light feeds only (lush flush attracts gall wasp) and the Oct gall check matters more than usual."
    category: prune
  - date: "2026-08-18"
    entry: "Eco-oil round 2 sprayed (whole tree) — scale treatment program complete. Now the verdict window: ant traffic over the next fortnight decides whether a third round is needed."
    category: spray
  - date: "2026-08-06"
    entry: "Compost tuck-under + mulch top-up done (with the other citrus). Remaining on this tree: second eco-oil spray ~13-20 Aug, keep picking."
    category: mulch
  - date: "2026-08-06"
    entry: "Baseline photo correction (Jay): the tub-tree shots I first filed here (IMG_2291/2292) are the GRAPEFRUIT. This orange's baseline shots: IMG_2303 is its profile (by the studio, fruit still on, foliage solid), and it's the background tree in IMG_2302 behind the lime. Keep picking; second eco-oil spray ~13-20 Aug unchanged, judged by ant traffic."
    category: general
  - date: "2026-07-30"
    entry: "Eco-oil round 1 sprayed (whole tree, scale treatment). Fed with Experts Choice, light dose — September feed replaced. Gall wasp triple-checked. Second oil spray due ~mid-Aug. Post-session photo (IMG_2086): foliage colour looking decent, good crop of ripe oranges still on the tree — harvest still to do."
    category: spray
  - date: "2026-07-30"
    entry: Second gall wasp pruning pass done. Eco-oil spray is the next job — harvest ripe oranges first, then spray.
    category: prune
  - date: "2026-07-21"
    entry: Epsom salts drench applied for the magnesium/interveinal yellowing.
    category: feed
  - date: "2026-07-21"
    entry: "Photo assessment: heavy ripe orange crop, interveinal chlorosis on older leaves (Mg/N hunger — fruit load + winter), ants trailing in parts with sooty smudges on leaves = suspected scale. Plan: harvest, oil spray x2, Epsom drench. Light clearance prune done (branches in the way only). One leaf with dense spider web — ordinary garden spider, harmless, left alone."
    category: general
tasks:
  - months:
      - 9
    task: "Late-winter feed (5 min): Experts Choice fruit & citrus, LIGHT dose, scattered under the outer canopy edge (not against the trunk) and watered in. Light on purpose: soft nitrogen-fed growth is exactly what gall wasps lay eggs into."
    category: feed
    completed: 2026-07
  - months:
      - 12
    task: "Summer feed (5 min): Experts Choice fruit & citrus, LIGHT dose, half what the bag says, scattered at the dripline and watered in. The tree was hard-pruned in Aug 2026 and will flush hard anyway; feeding it up just makes gall wasp bait."
    category: feed
  - months:
      - 3
    task: "Autumn feed (5 min): Experts Choice fruit & citrus, LIGHT dose at the dripline, watered in. Last feed before winter. Skip it if the tree is still pushing pale soft shoots from the summer feed: that is the gall wasp target, not a hungry tree."
    category: feed
  - months:
      - 9
    task: "Light shape prune (15 min, secateurs): only crossing or inward-growing branches and anything touching the ground, each cut back to a fork. Never more than a fifth of the canopy. Hard cuts bring the soft flush gall wasps want."
    category: prune
    completed: 2026-08
  - months:
      - 6
      - 7
      - 8
      - 9
    task: "Pick ripe oranges (whenever): full colour and a little give. Taste one first, they sweeten with hang time and hold on the tree for weeks"
    category: harvest
  - months:
      - 7
      - 8
    task: "Gall wasp check (5 min, no spraying, must be done before September): run hands along the young stems feeling for sausage-shaped swellings. Found one? Cut 5cm below it with secateurs and bin it, not compost, before month's end: the adults emerge from galls in Oct-Nov and lay into the spring flush. Nothing found = done"
    category: prune
    completed: 2026-10
  - months:
      - 10
    task: "Sugarcane top-up (10 min): 5cm from the bale over the whole root zone out to the canopy edge, a hand's width clear of the trunk. Citrus roots sit in the top 30cm and cook in a Melbourne summer without it"
    category: mulch
  - months:
      - 4
    task: "Sugarcane top-up (10 min): the summer layer has broken down to nothing by now. 5cm from the bale over the root zone, clear of the trunk, before the winter rain"
    category: mulch
  - months:
      - 1
      - 2
    task: "Leaf miner glance on the summer flush (2 min): silvery squiggly tunnels in the newest soft leaves = eco-oil both sides of the new growth on a cool evening under 25°, repeat in a week. Old leaves with tunnels are history, ignore them"
    category: spray
