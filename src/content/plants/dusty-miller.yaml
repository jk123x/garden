notes: "Tentative ID: Dusty Miller (Jacobaea maritima, syn. Senecio cineraria) — Jay doesn't know its origin, ID from July 2026 photos. Silver woolly leaves, small yellow clustered button flowers when mature. If correct, it's a bulletproof drought-hardy Mediterranean subshrub grown mainly for the silver foliage. The yellow flowers signal a mature plant; many gardeners shear them off to keep the silver foliage dense, but leaving them is harmless. Gets leggy over years — a light shear after flowering keeps it compact. Never needs water once established, dislikes wet feet, no feeding required. Confirm ID when convenient: woolly white felted leaves, deeply lobed, held on whitish stems."
tasks:
  - months:
      - 12
    day: 1
    task: "Shear the mound once the yellow buttons finish (scissors): spent stalks plus the top few cm of foliage off all over, so the silver stays dense. Every cut leaves silver leaves below it. Cut into bare old wood and that stem stays bare. On the strawberry side, take the side stems back to the mound's own footprint, each cut to a leaf: the strawberries own the ground beyond it. No feed, no water, ever."
    category: prune
  - months:
      - 3
    task: "Leggy check (scissors): bare woody stems showing under the silver = cut those stems back by a third to where there's still foliage. It goes woody and open by late summer if left"
    category: prune
