name: Dusty Miller
type: perennial
location: Backyard (lawn edge near the paving / wood-chip patch)
zones:
  - 4
health: "11 Nov 2026 (IMG_4354, IMG_4367): in full yellow-button flower and about twice its winter spread, but splayed flat and split open down the middle where the hose drags across it, and sprawling over the stepping stones where it gets trodden. The plant is healthy; the shape is hose and feet."
urgency: week
nextAction: "Neaten the hose line through the back bed (scissors): 1) Yellow buttons: grab the stems lying flat along the hose line and over the stepping stones and snip each back to where the clump still stands up, just above a leafy bit. 2) Needle-leaf shrub next to the citrus: snip the low branches lying on the ground on the hose side back to the main stem. 3) Mexican sage: cut any bent or snapped stems on the lawn-side edge off at the base. Don't cut into the upright centre of the yellow buttons; because that is where the flowers are. Photo on Field notes"
healthStatus: healthy
lastAssessed: 2026-11
log:
  - date: "2026-11-11"
    entry: "Jay: no stakes or hose guides, not interested; he raised the hose path as a reason to trim, not to reroute. Job rewritten as a neaten-the-hose-line trim. Never suggest hose posts again."
    category: general
  - date: "2026-11-11"
    entry: "Spring photo round (IMG_4354, IMG_4367): flowering hard and spreading, flattened along the hose line and over the stepping stones. Hose-guide job set in Do now with a Field notes plate. Side note, no action: the yellow button flowers on woolly silver stems fit yellow buttons (Chrysocephalum apiculatum) better than true dusty miller; care is the same."
    category: general
  - date: "2026-11-11"
    entry: "Boundary with the strawberries set (Jay asked how to handle the two competing): the mound keeps its current footprint and no more, strawberries get all the ground beyond it. Overhang gets cut back to a leaf at the December shear; strawberry runners under the skirt get cut at the mother. Neither plant is long-lived enough to be a structural worry."
    category: general
  - date: "2026-11-10"
    entry: "Shear pushed to 1 Dec (Jay): the yellow buttons are still thriving, he'll do it in early December."
    category: general
  - date: "2026-10-17"
    entry: "Card audit 17 Oct 2026: late-summer leggy trim added."
    category: general
  - date: "2026-08-06"
    entry: "CORRECTION after comparing photos side by side: the blue-grey lobed plant near the bench in IMG_2306 is NOT this dusty miller — its fronds are smooth, while the real dusty miller (record photo) is unmistakably woolly-white with yellow buttons. The 2306 plant is back on the ID list as an unknown. This entry's plant unchanged — healthy at the lawn edge, thriving on zero attention."
    category: general
  - date: "2026-08-04"
    entry: "Pine bark mulched from the Daisy's 1m³ 20mm bark delivery (Jay, 23 Oct 2026: the pile reached every bed bark is appropriate for; this is one of them). Good for 2-3 years, no top-up until bare soil shows."
    category: mulch
