name: Feijoa
type: fruit
location: Front fence (one side)
health: "Plan revised July 2026: no longer being removed. Renovation cut to ~70-80cm, then rebuild as dense ~1.5m shrubs leafy to the base — if the woodiness and maintenance stay under control, they stay. Fruit prevention regime continues regardless (fruit fly host)."
healthStatus: monitor
lastAssessed: "2026-07"
urgency: week
nextAction: "Hard cutback — DRY DAY (big cuts + wet = disease risk, same rule as the olive). Cut each leader to ~70-80cm even though the end goal is 1.5m: regrowth erupts at and below the cuts, so the cut height sets where the leafy base starts. Bare wood is fine — feijoas reshoot from dormant buds under old bark. No long stubs; clear dead/crossing wood in the middle; offcuts in the green bin. Then in late spring: tip the reshoots at ~30cm so they branch — that's what makes it dense instead of leggy again. Let it rise to 1.5m over 1-2 years, held with 1-2 hedge trims a year. IMPORTANT: cancel/repurpose the removal contractor if still booked."
image: /images/plants/IMG_0988.jpg
notes: "Pineapple guava (Acca sellowiana). Near the front fence. KEPT-SHORT REGIME (from July 2026): renovation cut to ~1m, then manage as a short shrub. No fruit wanted — strip flowers in October before fruit sets (they'll all be in reach on a short plant), or hedge-trim the new growth tips in late spring; regularly trimmed feijoas barely flower. First spring after the hard cut it will flower much less anyway (energy goes to regrowth). Intentionally NOT mulched — bare soil makes fallen-fruit pickup easier if any fruit sneaks through. Any fallen fruit: daily pickup, solarise in a sealed black bag 2+ weeks or red-lid bin — never compost, fruit fly host. No feed while re-establishing after the cut — lean conditions also keep the regrowth manageable."
