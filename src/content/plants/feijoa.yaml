    task: "Strip every flower (every few days through Oct-Nov): pinch off the red-and-white flowers and buds along all the regrowth, all within reach on a 1m plant. First flower seen and snipped 22 Oct 2026. Flowering runs 4-5 weeks, so keep walking past it. A missed flower is a fruit on the ground in autumn, and that's fruit fly. The petals are edible and sweet"
    category: general
  - months:
      - 11
      - 12
    task: "Tip the regrowth (scissors): once new shoots reach about 30cm, snip 2-3cm off each tip so it branches. Builds the dense low shrub and stops late flowers. Only the soft new shoots, not back into old wood."
    category: prune
