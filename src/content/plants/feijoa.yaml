notes: "Pineapple guava (Acca sellowiana). Near the front fence. KEPT-SHORT REGIME (from July 2026): renovation cut to ~1m, then manage as a short shrub. No fruit wanted — strip flowers in October before fruit sets (they'll all be in reach on a short plant), or hedge-trim the new growth tips in late spring; regularly trimmed feijoas barely flower. First spring after the hard cut it will flower much less anyway (energy goes to regrowth). Mulch policy updated Aug 2026: bed now gets wood-chip mulch (the old keep-it-bare-for-fruit-pickup rule is retired — the flower-strip regime means effectively no fruit; if any sneaks through, check under mulch during pickup season). Any fallen fruit: daily pickup, solarise in a sealed black bag 2+ weeks or red-lid bin — never compost, fruit fly host. No feed while re-establishing after the cut — lean conditions also keep the regrowth manageable."
log:
  - date: "2026-08-06"
    entry: "End-of-winter baseline photos (IMG_2273/2277/2279). Trunks at ~1m along the fence with retained leafy laterals, fresh bark down — the 'before' shot for the October reshoot flush. Bed looks clean."
    category: general
  - date: "2026-08-04"
    entry: "Bed mulched — the Daisy's 1m³ of 20mm pine bark spread (bark only, no compost — lean regime while the shrubs rebuild). Jay's verdict on bulk delivery: not worth it for this house — heavy barrowing from the kerb, quality no better than bagged. Future mulch comes as Gardensure 50L bags from Bunnings, carried direct to each bed."
    category: mulch
  - date: "2026-08-02"
    entry: "Renovation fully complete — post-cut tidy done, over-fence laterals brought inside the line, bed cleared (photos IMG_2164-2168). The thin white/grey rod in the bed is firmly anchored — treated as an irrigation riser (green fitting nearby), LEAVE IT, do not pull. Next touch: October flower-strip, Nov-Dec tip-prune at ~30cm regrowth. Bed mulching queued."
    category: prune
  - date: "2026-07-31"
    entry: "MAIN CUT COMPLETE (evening) — every trunk down to ~1m just below fence top, clean angled cuts, low leafy growth retained under the cut plane (photos IMG_2121-2123; IMG_2122 now the profile shot). Tidy pending next day: pull the long laterals arching over the fence back inside the line, clear debris off the chalk sticks. September prune task satisfied by this cut."
    category: prune
  - date: "2026-07-31"
    entry: "Renovation cut underway — first trunks taken down to ~1m (cut height revised from 70-80cm to just-below-fence-top after photo review; hidden stubs + a season of regrowth room to the 1.5m target). Cuts are clean and angled, right call on height (photos IMG_2114/2117). Guidance given: keep leafy growth below the cut plane as the interim solar panel, only shorten strays poking above it; formal tipping waits for Nov-Dec at 30cm regrowth."
    category: prune
  - date: "2026-07-29"
    entry: "Plan revised: keeping the feijoas. Hard cutback to ~1m planned as an important upcoming job — trial as short managed shrubs instead of removal. Contractor removal arrangement superseded (cancel if still pending). October flower-strip becomes the permanent no-fruit strategy."
    category: general
  - date: "2026-07-21"
    entry: "Gardener visit (feijoa removal + west wall climber) not happening. New plan: DIY cut-and-paint to stumps before spring, or book a one-off contractor. Stump removal can wait indefinitely once the tree is dead."
    category: general
  - date: "2026-05-18"
    entry: "Decision to remove feijoa entirely. Too much maintenance — grows too tall, fruit fly breeding host, daily fruit pickup. Gardener booked for Jul/Aug visit to remove, or Jay may DIY."
    category: general
