nextAction: "Remove tree — gardener visit Jul/Aug or DIY"
image: /images/plants/IMG_0988.jpg
notes: "Pineapple guava (Acca sellowiana). Near the front fence. Intentionally NOT mulched — bare soil makes daily fallen fruit pickup easier. Fruit fly management is the priority: strategy is to prevent fruit from developing rather than fight the pest on ripe fruit. Remove flowers in October before fruit sets (or net the whole tree before flowering). Pick up any fallen fruit daily and solarise in a sealed black bag 2+ weeks or red-lid bin — never compost. Tree itself is healthy and still needs the thinning cut in late winter (August) to open up the interior."
