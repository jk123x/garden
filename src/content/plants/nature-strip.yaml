    entry: "Second-pass remainder dropped from the pre-baby list (Jay's call — too low priority). The un-weeded half will seed through spring; consequence is a heavier weed load for the next proper pass, which is fine — it's a nature strip. Next round: the existing summer/autumn 2027 weed-and-tidy task, taproot puller when soil is soft."
    category: general
  - date: "2026-08-06"
    entry: "End-of-winter baseline photos (IMG_2276). Thistle and flatweed rosettes visible on the un-done half — the second pass is still the right call before they seed."
