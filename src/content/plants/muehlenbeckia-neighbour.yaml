    category: feed
log:
  - date: "2026-10-23"
    entry: "Jay: strands have untwined from the Sept ties and are reaching out from the fence for light. Advice: shear every reacher to 5-10cm outside the wires, scissors, as often as seen; don't re-tie reachers; leave anything running flat along the fence. Rule written into notes and the monthly rows."
    category: general
  - date: "2026-10-17"
    entry: "Card audit 17 Oct 2026: stale Sept dieback-check row deleted."
    category: general
  - date: "2026-10-07"
    entry: "October coverage training DONE on the east boundary fence (same session as the south and west fences): stems tied flat to our face, face kept to a flat sheet, leaders along the bare run. Next pass is November's row."
    category: general
  - date: "2026-09-17"
    entry: "Jay tied a good number of garden ties along the fence to guide the stems into a coverage skeleton. Vine is cut back hard everywhere but well guided. Ties are temporary: the vine holds itself once laterals wrap the wire, so the Dec + Mar tie-check rows decide tie by tie when each comes off."
    category: general
  - date: "2026-09-08"
    entry: "Same afternoon: Multiguard scattered along the base on our side, deep hand-water at the crown. Snail job closed. Next touch is the late-Sept dieback check."
    category: general
  - date: "2026-09-08"
    entry: "After-flatten photos (IMG_3491/3492). Jay took the blob right back to a flat stem skeleton, harder than the south fence, which is correct for this one. Fan of stems tied down into the lower panel right of the post, a couple of runners led along the rail, base shoots green. Almost no leaf left: fine in early spring with crowns intact, but it means 4-6 bare weeks and no slack for pests. Snails spotted on the rail: pick + Multiguard set as the do-now. Deep hand-water at the crown today. Leaders along the bare right half wait for the flush; the monthly training task covers it."
    category: prune
  - date: "2026-09-08"
    entry: "Jay gave it a haircut with garden scissors (IMG_3482-3485). Photos show the real problem: it's a deep woody blob perched on the fence, not a flat panel in it — the interior is dead wood (normal), the neighbour's flush shearing means nothing anchors it on her side, so the live mass hangs off on ours. Jay has been tying runners through with garden ties. Plan set: flatten our face to ~10cm (secateurs needed for the pencil-thick wood), tie main stems to the wires on our face only, lead runners along the bare fence toward the corner. Two growing seasons to meet the south fence vine."
    category: prune
  - date: "2026-09-05"
    entry: "Jay reports the neighbour-fence job done (tie/train + trim). Ongoing from here: glance at the ties after the neighbour's trimming sessions, and keep training new leaders horizontally into the bare two-thirds as spring growth comes."
    category: general
  - date: "2026-08-04"
    entry: "Pine bark mulched from the Daisy's 1m³ 20mm bark delivery (Jay, 23 Oct 2026: the pile reached every bed bark is appropriate for; this is one of them). Good for 2-3 years, no top-up until bare soil shows."
    category: mulch
  - date: "2026-07-29"
    entry: "First record created. Coverage assessed at ~1/3 of the fence, not extending because the neighbour's hard hedge-trimming shears off attachment growth through the grates — vine hangs detached on our side. Plan: soft-tie stems to the fence and train laterally; ~2 growing seasons to full cover once attached. Fed with Richgro All Purpose in the 29 Jul blitz along with the other two — September feed replaced."
    category: general
