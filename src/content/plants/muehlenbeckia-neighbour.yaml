notes: "Wire vine / maidenhair vine (Muehlenbeckia complexa), third of the three front-boundary muehlenbeckias. Runs along the EAST boundary; plan is for it and the front (south) fence vine to grow toward each other and meet at the corner. Neighbour is elderly and shears her side hard to keep her walkway clear — that's fine and won't change; our side has to carry the attachment. The neighbour's trimming isn't harmful in itself — muehlenbeckia responds to hedging by densifying — but it keeps stripping the attachment points, so the vine can't hold or extend along the fence. Fix is structural: tie main stems firmly to our side of the fence with soft ties through the grates, below where the trimmer reaches, and train leaders horizontally along the uncovered two-thirds. Done properly, the ongoing trimming becomes free density maintenance and full coverage is roughly two growing seasons away. Left alone, it stays at a third indefinitely. REACHERS RULE (Jay, 23 Oct 2026): any strand standing off the fence chasing light gets cut back to 5-10cm outside the wires with scissors, whenever seen, no monthly limit (the monthly ceiling is for the full-face top shear only). Never re-tie a reacher, the tip pulls out again; ties are for laying a strand along bare fence. Each cut reacher branches into 2-3 fence-hugging laterals, which is the coverage. Why a stub and not flush (Jay asked, 23 Oct): the 5-10cm stub carries the nodes the new laterals grow from, cut flush and regrowth comes slowly from old wood as one shoot. The stub is the thickness of the finished mat, not a gap. Over sections that are ALREADY dense, cut flush to the face, that is the top shear."
tasks:
  - months:
      - 12
      - 3
    task: "Tie check (scissors): the Sept garden ties were guides, not permanent. Undo each one in turn. Stem stays flat on the fence by itself (its laterals have wrapped the wire) = leave the tie off. Stem springs away = re-tie it loose. Also cut off any tie that is biting into a stem. Every Sept tie should be off by the end of March; a tie left on for a year girdles the stem."
    category: general
  - months:
      - 3
      - 9
    task: "Season trim: shear our face back to about 10cm out from the fence wires, following the fence line, so it stays a flat sheet and not a blob. Scissors for green handfuls, secateurs for the stiff dark core stems. Leave the dead twiggy skeleton inside: it reshoots. Check every tie still holds and none is cutting into a stem."
    category: prune
    completed: 2026-09
  - months:
      - 9
    task: "Feed: Richgro All Purpose, normal dose, scattered along the fence base on our side and watered in. Last calm weekend before spring."
    category: feed
    completed: 2026-07
  - months:
      - 10
      - 11
      - 12
      - 1
      - 2
      - 3
    task: "Coverage training: tie main stems flat to the wires on OUR face (loose figure-8, never woven through to her side — she shears it off), lead leaders horizontally into the bare run toward the front corner, shear our face back to ~10cm out from the wires so it stays a flat sheet not a blob, re-check ties after the neighbour's hedge-trim sessions — her trimming is free density IF the vine stays attached Reachers (strands standing off the fence chasing light): cut to 5-10cm outside the wires whenever seen, don't re-tie them"
    category: general
