health: Canopy is open/sparse but that's partly intentional — Jay pruned the lower branches to let light through to plants below. Leaves look dark green where visible. The open structure is a combination of deliberate shaping and normal autumn thinning.
healthStatus: good
lastAssessed: 2026-09
