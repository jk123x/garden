notes: Hymenosporum flavum. 4+ metres tall. The sparse canopy that looked concerning in the original silhouette photo is actually partly by design — Jay pruned lower branches to improve light for understorey plants. The remaining leaves look dark green and healthy where visible in the newer photos (0981-0982). Still semi-deciduous so some thinning in autumn is expected. The tree structure looks fine — no major dieback or dead branches visible. Pruning dropped from the plan July 2026 — canopy is too high to reach safely and it doesn't need it; don't re-add prune tasks.
tasks:
  - months:
      - 12
    task: "Midday shade check on the orange: stand at the orange at midday and look at its crown. In the frangipani's long lateral's shadow = shorten that lateral by about a third, back to an upward side branch, never a stub (flowering is over by now, and a shorter limb snaps less in summer wind). While there, look at the lawn under the limb: a patch gone thin and open with bare soil between runners while the rest stays tight = same trigger, shorten the lateral. Orange crown in sun and lawn tight = leave the tree alone. The jasmine takes shade fine, ignore it."
    category: prune
  - months:
      - 9
    task: "Feed: Richgro All Purpose, normal dose, scattered over the root zone out to the dripline and watered in. Keep it off the trunk."
    category: feed
    completed: 2026-07
log:
  - date: "2026-09-16"
    entry: "Jay (IMG_3715): canopy going nuts, one long high lateral reaching out sideways, tree in flower. Asked if it'll shade out what's below. Answer: no. Tiered open canopy, high limb = moving dappled shade, nothing under it is in shade all day. Only the orange would care (fruit set). December midday shade check on the orange's crown decides whether the lateral gets shortened; otherwise leave it."
    category: general
  - date: "2026-08-06"
    entry: End-of-winter baseline photos (IMG_2288/2296-2298 — Jay confirmed the tree over the flower-bed corner in 2288 is this one, not the grapefruit). Tall canopy holding dense and dark green through winter, trunk sound. The understorey arrangement (bartlettina + strappy clumps at the base) looks settled.
    category: general
  - date: "2026-08-04"
    entry: "Pine bark mulched from the Daisy's 1m³ 20mm bark delivery (Jay, 23 Oct 2026: the pile reached every bed bark is appropriate for; this is one of them). Good for 2-3 years, no top-up until bare soil shows."
    category: mulch
  - date: "2026-07-29"
    entry: Fed with Richgro All Purpose (pre-baby feed blitz) — replaces the September feed.
    category: feed
