notes: "Hymenosporum flavum. 4+ metres tall. The sparse canopy that looked concerning in the original silhouette photo is actually partly by design — Jay pruned lower branches to improve light for understorey plants. The remaining leaves look dark green and healthy where visible in the newer photos (0981-0982). Still semi-deciduous so some thinning in autumn is expected. The tree structure looks fine — no major dieback or dead branches visible. Pruning dropped from the plan July 2026 — canopy is too high to reach safely and it doesn't need it; don't re-add prune tasks."
