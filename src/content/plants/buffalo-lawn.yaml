notes: "Roughly 5x5m patch in the backyard. The lawn is green which is positive, but the coverage is thin/patchy — you can see bare spots. Could benefit from aeration (October, while actively growing) and regular feeds. No reseeding — buffalo isn't sold as seed and fills bare patches itself via runners, so mowing + feeding is what drives recovery. Clear the autumn leaf drop regularly so the grass gets light. Winter grass (Poa annua) is the main weed pressure May–August — pull by hand before it seeds, or it'll explode in spring. Second watch-list weed (flagged by the gardener): kikuyu — a bright-green runner grass that invades buffalo permanently and can't be selectively sprayed out. Distinguish from buffalo by narrow pointed folded leaves vs buffalo's broad round-tipped ones. Remove whole runners including rooted nodes the moment any appears."
