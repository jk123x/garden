name: Buffalo Lawn
type: grass
location: Backyard
zones:
  - 2
health: Green but thin and patchy in places, with some worn/brown patches on the west side. Winter grass purge fully done 21 July 2026, before seed set. Feed done (front-loaded July). No reseeding (Jay, Sept 2026 — buffalo fills patches via runners anyway); aerate in October when actively growing.
healthStatus: monitor
