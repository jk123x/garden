name: Buffalo Lawn
type: grass
location: Backyard
health: "Green but thin and patchy in places, with some worn/brown patches on the west side. Winter grass purge fully done 21 July 2026, before seed set. Spring aerate + feed + overseeding of bare patches is the next big step (September)."
healthStatus: monitor
lastAssessed: "2026-07"
image: /images/plants/IMG_0978.jpg
notes: "Roughly 5x5m patch in the backyard. The lawn is green which is positive, but the coverage is thin/patchy — you can see bare spots. Could benefit from aeration (September), a feed, and overseeding any bare patches. Buffalo recovers well from runners so it should fill in with some attention. Clear the autumn leaf drop regularly so the grass gets light. Winter grass (Poa annua) is the main weed pressure May–August — pull by hand before it seeds, or it'll explode in spring. Second watch-list weed (flagged by the gardener): kikuyu — a bright-green runner grass that invades buffalo permanently and can't be selectively sprayed out. Distinguish from buffalo by narrow pointed folded leaves vs buffalo's broad round-tipped ones. Remove whole runners including rooted nodes the moment any appears."
