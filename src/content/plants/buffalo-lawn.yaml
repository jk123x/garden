log:
  - date: "2026-09-05"
    entry: "Species rethink (Jay): switched from kikuyu years ago because it ran wild; buffalo grows slower but is now delivering 'lawn only in summer' — inverted for a family whose kids play outside at 15-20°, not 35°. Tall fescue flagged as the honest alternative: year-round green, clumping (no kikuyu-style invasion), seed-repairable, but needs summer irrigation + year-round mowing. Decision deferred to March 2027 (task added): give buffalo this season's densify program first, convert in the autumn seeding window if it still disappoints. Key context: the lawn was FLOODED last year by mis-coded irrigation — much of the current thinness is likely flood damage growing out, not species character, so this is buffalo's first fair season. Benchmark for March: well-kept buffalo = good Oct-May, dull-but-green winter (autumn feed + no scalping). If Jay wants grass that looks GOOD in July, that's fescue territory regardless."
    category: general
  - date: "2026-09-05"
    entry: "Jay raked leaves off and ripped out winter grass — the real early-spring lawn jobs, done. Lawn still very bare/thin, so no point mowing yet: first mow waits until there's actual growth to cut (~Oct). Aerate Oct. Watch: bare patches are open ground for spring weeds — pull anything green that isn't buffalo when passing, so the runners get the space."
    category: general
  - date: "2026-07-31"
    entry: "Fed with Sudden Impact for Lawns — September feed front-loaded (pre-baby blitz). Spring aerate + overseed of bare patches remains the September job."
    category: feed
  - date: "2026-07-21"
    entry: "Winter grass purge fully done — Poa annua pulled before seed set, plus misc broadleaf weeds. Watch-list stays: kikuyu (bright green runner grass, dig out whole runners incl. rooted nodes — can't be sprayed out of buffalo)."
    category: general
  - date: "2026-05-06"
